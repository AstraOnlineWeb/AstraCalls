openapi: 3.0.3
info:
  title: AstraCalls API
  version: "1.1.1"
  description: |
    API HTTP do **AstraCalls** — chamadas de voz do WhatsApp pelo navegador.

    ## Autenticação
    Não há login/senha. As rotas `/api/*` são protegidas por API key: envie o header
    **`X-API-Key`** com o valor definido em `WACALLS_API_KEY` (ou `?apiKey=...` na query).
    Se `WACALLS_API_KEY` estiver vazia, a autenticação fica desligada.

    O header **`X-Client-Id`** é opcional e **não autentica nada** — é só um identificador
    estável usado para marcar o "dono" das chamadas e filtrar eventos.

    > ⚠️ A API inicia/controla as chamadas (sinalização), mas o **áudio** exige um cliente
    > WebRTC (navegador) com captura de microfone — não é possível só com chamadas HTTP.

    ## Chave de widget
    Além da chave-mestra, existe uma credencial restrita para o widget do Chatwoot, que só
    libera `/api/events`, `GET /api/chatwoot/resolve` e as rotas de chamada
    (`/api/sessions/{sid}/calls...`): a chave estática `WACALLS_WIDGET_KEY`
    (`GET /api/widget-key`) ou um token efêmero por conta (`POST /api/widget-tokens`, recomendado).

    ## Erros comuns
    Os erros vêm em JSON no formato `{"error": "mensagem"}` (às vezes com campos extras,
    ex.: `status`). Valem para todas as rotas e não são repetidos em cada uma:

    - **404** `{"error":"no such session"}` — o `{sid}` não existe (qualquer rota `/api/sessions/{sid}/...`).
    - **503** `{"error":"not paired"}` — a sessão existe mas não está pareada/conectada
      (rotas que falam com o WhatsApp: mensagens, contatos, grupos, canais, perfil etc.).
    - **400** — body/parâmetros inválidos ou faltando.
    - **401** `{"error":"unauthorized"}` — API key ausente ou errada.
    - **500/502** — falha do WhatsApp/serviço externo (mensagem em `error`).

    ## Idempotência no envio
    As rotas de envio de mensagem (`POST .../messages/*`, exceto `pix`) aceitam um id de
    mensagem escolhido pelo cliente no header **`X-Message-ID`** ou em `?id=`. Reenviar com
    o mesmo id NÃO duplica a mensagem no WhatsApp. Gere um id em
    `GET .../messages/new-message-id`.
servers:
  - url: /
    description: Mesma origem do painel

tags:
  - name: Sessões
    description: Contas WhatsApp (cada sessão = um device linkado)
  - name: Chamadas
    description: Iniciar, atender, rejeitar e encerrar chamadas
  - name: SIP
    description: Gateway SIP (sipgo nativo, sem Asterisk) — modelo 1 (PBX registra aqui) e modelo 2 (registrar em PBX externo, com outbound proxy)
  - name: Mensagens
    description: Envio e ações de mensagem (texto, mídia, localização, contato, enquete, reação, edição, exclusão, visto, digitando)
  - name: Contatos
    description: Verificar número, listar/consultar contatos, foto, bloquear/desbloquear
  - name: Grupos
    description: Criar, listar e administrar grupos e participantes
  - name: Comunidades
    description: Criar comunidades, vincular/desvincular grupos, listar grupos e membros
  - name: Canais
    description: Canais/Newsletters (seguir, silenciar, mensagens)
  - name: Presença & Perfil
    description: Presença (online/digitando), perfil próprio e status/stories
  - name: Webhook
    description: "Configura a URL que recebe os eventos da sessão (ex: integração com Chatwoot)"
  - name: Chatwoot
    description: "Integração nativa com Chatwoot (canal API): WhatsApp <-> caixa de entrada"
  - name: Eventos & Histórico
  - name: Interativas
    description: "Botões, listas e carrossel (native flow). Renderizam no app; garantia total só via API oficial."
  - name: Disparo
    description: "Disparo em massa (blast) com pacing anti-ban"
  - name: Observabilidade
    description: "Health checks e métricas (liveness/readiness/Prometheus)"
  - name: Widget
    description: "Credenciais restritas para o widget do Chatwoot (só com a chave-mestra)"

security:
  - apiKeyAuth: []

components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: "API key definida em WACALLS_API_KEY (vazia = sem autenticação)"
  parameters:
    ClientId:
      name: X-Client-Id
      in: header
      required: false
      schema: { type: string, example: meuapp }
      description: >-
        Opcional. Identificador do cliente (dono da chamada / filtro de eventos).
        NÃO é autenticação — para autenticar use o header X-API-Key.
    Sid:
      name: sid
      in: path
      required: true
      schema: { type: string }
      description: ID da sessão (conta WhatsApp).
    CallId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: ID da chamada.
    Jid:
      name: jid
      in: path
      required: true
      schema: { type: string }
      description: Número (DDI+DDD) ou JID completo do contato.
    Gid:
      name: gid
      in: path
      required: true
      schema: { type: string }
      description: ID do grupo (com ou sem @g.us).
    Cid:
      name: cid
      in: path
      required: true
      schema: { type: string }
      description: ID da comunidade (com ou sem @g.us).
    ChannelId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: ID do canal/newsletter (com ou sem @newsletter).
    ChatId:
      name: chatId
      in: path
      required: true
      schema: { type: string }
      description: Número ou JID do chat.
  schemas:
    SIPAgentConfig:
      type: object
      properties:
        inboundMode: { type: string, enum: [originate, agent, auto], example: agent }
        agentAutoAnswer: { type: boolean, description: "true = 200 OK logo após o 180, sem esperar o POST /accept" }
        agentRingTimeoutSeconds: { type: integer, example: 30, description: "Sem accept nesse prazo o INVITE recebe 480 (0 = WACALLS_RING_TIMEOUT_SECONDS)" }
    Session:
      type: object
      properties:
        id: { type: string, example: 6458cca60a17c0cefa71de9da9dc92a2 }
        name: { type: string, example: WhatsApp }
        jid: { type: string, example: "556192264108:13@s.whatsapp.net" }
        lastJid: { type: string, description: "Último número conectado (continua preenchido depois de desconectar)" }
        state:
          type: string
          enum: [connecting, open, logged_out, qr, pairing_code, passkey_request]
          example: open
          description: "connecting = conectando; open = conectada; logged_out = deslogada; qr = aguardando leitura do QR; pairing_code = aguardando o código de pareamento; passkey_request = aguardando a asserção WebAuthn"
        paired: { type: boolean, example: true }
        recording: { type: boolean, example: false, description: "Gravação de chamadas ligada para esta conta" }
        sip_user: { type: string, description: "SIP modelo 1: usuário de registro (CREDENCIAL)" }
        sip_pass: { type: string, description: "SIP modelo 1: senha de registro (CREDENCIAL)" }
        sip_url: { type: string, description: "SIP modelo 1: URL/host de registro" }
        sip_ext_enabled: { type: boolean, description: "SIP modelo 2 (PBX externo) ligado" }
        sip_ext_host: { type: string }
        sip_ext_port: { type: integer }
        sip_ext_user: { type: string, description: "CREDENCIAL" }
        sip_ext_pass: { type: string, description: "CREDENCIAL" }
        sip_ext_dest: { type: string }
        sip_ext_proxy: { type: string }
        sip_ext_status: { type: string, description: "registering/registered/failed" }
        sip_ext_error: { type: string }
    StartCallRequest:
      type: object
      required: [phone]
      properties:
        phone: { type: string, example: "5561999999999", description: "DDI+DDD+número" }
        video: { type: boolean, default: false, description: "true = chamada de vídeo" }
        record: { type: boolean, example: false, description: "Grava esta chamada" }
        duration_ms: { oneOf: [{ type: integer }, { type: string }], description: "Reservado: aceito (número ou string) mas IGNORADO" }
    MediaBody:
      type: object
      required: [to]
      description: "Envie a mídia por **base64** OU por **url** (um dos dois)."
      properties:
        to: { type: string, example: "5561999999999", description: "Número ou JID completo" }
        base64: { type: string, description: "Conteúdo em base64 (aceita prefixo data:...)" }
        url: { type: string, description: "URL de onde baixar a mídia" }
        mimetype: { type: string, example: "image/jpeg" }
        quotedMessageId: { type: string, description: "Cita (responde) a mensagem com esse id." }
        participant: { type: string, description: "Opcional. Em grupo, JID de quem enviou a mensagem citada." }
        fromMe: { type: boolean, description: "Opcional. true se a mensagem citada foi enviada por você." }
        mentions: { type: array, items: { type: string }, description: "Números ou JIDs a mencionar (@) na legenda." }
        mentionAll: { type: boolean, description: "GRUPO: marca todos os participantes (marcação fantasma — não precisa de @ na legenda)." }
    CommunityGroups:
      type: object
      properties:
        groups: { type: array, items: { type: string }, example: ["120363000000000001@g.us"] }
        group: { type: string, description: "atalho para um grupo só" }
    GroupInfo:
      type: object
      description: "Inclui aliases de compatibilidade (id/subject/description) ao lado dos campos nativos."
      properties:
        jid: { type: string, example: "120363000000000000@g.us" }
        name: { type: string }
        topic: { type: string }
        owner: { type: string, description: "Dono: telefone@s.whatsapp.net quando conhecido; senão o JID original (pode ser @lid)" }
        ownerPhone: { type: string, description: "Telefone do dono (\"\" se desconhecido)", example: "556196878959" }
        ownerLid: { type: string, description: "LID do dono quando o grupo é LID (\"\" senão)", example: "60838698344603@lid" }
        announce: { type: boolean, description: "true = só admins enviam" }
        locked: { type: boolean, description: "true = só admins editam info" }
        created: { type: integer, format: int64, description: "Criação do grupo (epoch em milissegundos)" }
        id: { type: string, description: "alias de jid", example: "120363000000000000@g.us" }
        subject: { type: string, description: "alias de name" }
        description: { type: string, description: "alias de topic" }
        isCommunity: { type: boolean, description: "true = é uma comunidade (grupo pai)" }
        parentJid: { type: string, description: "comunidade à qual o grupo está vinculado (vazio se nenhuma)" }
        isAnnouncementGroup: { type: boolean, description: "true = grupo de avisos da comunidade" }
        participants:
          type: array
          items: { $ref: "#/components/schemas/GroupParticipant" }
    GroupParticipant:
      type: object
      description: "Participante de grupo/comunidade."
      properties:
        jid: { type: string, description: "JID de envio (pode ser @lid)", example: "60838698344603@lid" }
        phone: { type: string, description: "telefone real; vazio se o LID não resolver (nunca os dígitos do LID)", example: "556196878959" }
        lid: { type: string, description: "LID quando conhecido", example: "60838698344603@lid" }
        number: { type: string, description: "telefone quando conhecido; senão o user do JID (compat)" }
        name: { type: string, description: "nome do contato (agenda, pushName ou nome comercial)", example: "Raphael" }
        pushName: { type: string, description: "nome de perfil do WhatsApp" }
        isAdmin: { type: boolean }
        isSuperAdmin: { type: boolean }
        admin: { type: boolean, description: "isAdmin || isSuperAdmin" }
        id: { type: string, description: "alias WAHA: telefone@c.us quando o telefone é conhecido; senão o JID @lid", example: "556196878959@c.us" }
        pn: { type: string, description: "alias: SÓ o telefone real (\"\" se o LID não resolver)" }
        role: { type: string, enum: [participant, admin, superadmin] }
    ParticipantChange:
      type: object
      description: "Resultado por participante numa ação de grupo (add/remove/promote/demote)."
      properties:
        jid: { type: string, description: "JID devolvido pelo WhatsApp (pode ser @lid)" }
        phone: { type: string, description: "Telefone real quando o WhatsApp informa/o LID resolve; senão \"\"" }
        isAdmin: { type: boolean }
        error: { type: integer, description: "Código de erro do WhatsApp p/ este participante (ex.: 403, 409, 451); ausente = sucesso" }
    SubGroup:
      type: object
      description: "Grupo vinculado a uma comunidade."
      properties:
        jid: { type: string, example: "120363000000000001@g.us" }
        id: { type: string, description: "alias de jid" }
        name: { type: string }
        subject: { type: string, description: "alias de name" }
        isAnnouncementGroup: { type: boolean }
    CommunityParticipantAdd:
      type: object
      properties:
        jid: { type: string, description: "Pode ser @lid" }
        phone: { type: string, description: "Telefone real quando o WhatsApp informa; senão \"\"" }
        ok: { type: boolean }
        error: { type: integer, description: "Código de erro do WhatsApp (só em quem falhou)" }
    Error:
      type: object
      properties:
        error: { type: string }
    WebhookConfig:
      type: object
      properties:
        webhook: { type: string, description: "URL configurada (\"\" = nenhuma)" }
        hasSecret: { type: boolean, description: "true se há secret (o valor nunca é devolvido)" }
        events: { type: array, items: { type: string }, description: "Filtro de eventos (vazio = todos)" }
        ignoreGroups: { type: boolean, description: "true = eventos de grupo não são entregues" }
    ChatwootConfig:
      type: object
      description: "Configuração da integração Chatwoot. `account_token` NUNCA é devolvido (vem vazio)."
      properties:
        url: { type: string }
        account_id: { type: integer }
        account_token: { type: string, description: "Sempre \"\" nas respostas (omitido por segurança)" }
        inbox_id: { type: integer }
        inbox_identifier: { type: string }
        groups: { type: boolean }
        channels: { type: boolean }
        groups_skip_incoming: { type: boolean }
        sign_msg: { type: boolean }
        always_online: { type: boolean }
        read_messages: { type: boolean }
        mirror_api: { type: boolean }
        import_history: { type: boolean }
        import_history_days: { type: integer }
    CallRecord:
      type: object
      properties:
        sessionId: { type: string }
        callId: { type: string }
        owner: { type: string, nullable: true, description: "clientId de quem atendeu/iniciou" }
        direction: { type: string, enum: [inbound, outbound] }
        peer: { type: string, description: "JID do interlocutor" }
        startedAt: { type: integer, format: int64, description: "epoch ms" }
        status: { type: string, enum: [starting, ringing, connected, ended] }
        held: { type: boolean }
        endedAt: { type: integer, format: int64, description: "epoch ms (só no histórico)" }
        endReason: { type: string }
    PrivacySettings:
      type: object
      description: "Mesmo formato (camelCase) no GET /privacy e no `settings` do PUT."
      properties:
        groupAdd: { type: string }
        lastSeen: { type: string }
        status: { type: string }
        profile: { type: string }
        readReceipts: { type: string }
        callAdd: { type: string }
        online: { type: string }
        messages: { type: string }
        defense: { type: string, description: "on_standard | off" }
        stickers: { type: string }
    Channel:
      type: object
      properties:
        jid: { type: string, example: "120363000000000000@newsletter" }
        name: { type: string }
        description: { type: string }
        subscribers: { type: integer }
        invite: { type: string, description: "Código de convite" }
        id: { type: string, description: "alias de jid" }
        subscribersCount: { type: integer, description: "alias de subscribers" }
        role: { type: string, description: "Papel da conta no canal (só quando o WhatsApp informa)" }
        muted: { type: boolean, description: "Só quando o WhatsApp informa" }
    BlastJob:
      type: object
      properties:
        id: { type: string }
        sessionId: { type: string }
        status: { type: string, enum: [pending, running, completed, completed_with_failures, canceled] }
        total: { type: integer }
        sent: { type: integer }
        failed: { type: integer }
        createdAt: { type: integer, format: int64, description: "epoch ms" }
    ScheduledMessage:
      type: object
      properties:
        id: { type: integer, format: int64 }
        sessionId: { type: string }
        to: { type: string, description: "JID de destino" }
        sendAt: { type: integer, format: int64, description: "epoch ms" }
        status: { type: string, example: pending }
        lastError: { type: string }
        createdAt: { type: integer, format: int64, description: "epoch ms" }
  requestBodies:
    Participants:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [participants]
            properties:
              participants:
                type: array
                items: { type: string }
                example: ["5561988887777@s.whatsapp.net", "5561966665555"]
  responses:
    SendOK:
      description: Mensagem enviada
      content:
        application/json:
          schema:
            type: object
            properties:
              id: { type: string, description: "ID da mensagem no WhatsApp" }
              to: { type: string, description: "JID de destino" }
              timestamp: { type: integer, format: int64, description: "epoch em milissegundos" }
    NotFound:
      description: "Sessão inexistente"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "no such session" }
    NotPaired:
      description: "Sessão não pareada/conectada"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "not paired" }
    BadRequest:
      description: "Body/parâmetros inválidos"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    OkTrue:
      description: OK
      content:
        application/json:
          schema: { type: object, properties: { ok: { type: boolean, example: true } } }
    ParticipantChangeResult:
      description: "Resultado por participante"
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: { type: boolean }
              participants: { type: array, items: { $ref: "#/components/schemas/ParticipantChange" } }
    MessageList:
      description: Lista de mensagens
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                chat: { type: string }
                sender: { type: string }
                id: { type: string }
                fromMe: { type: boolean }
                timestamp: { type: integer, format: int64 }
                type: { type: string, example: text }
                body: { type: string }
                raw: { type: object, description: "Só com ?raw=true" }
                from: { type: string, description: "alias (remetente em número@c.us)" }
                chatId: { type: string, description: "alias (chat em número@c.us)" }
    Group:
      description: Dados do grupo
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GroupInfo" }
    CommunityLinkResult:
      description: Resultado por grupo
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: { type: boolean, description: "true = todos deram certo" }
              results:
                type: array
                items:
                  type: object
                  properties:
                    group: { type: string }
                    ok: { type: boolean }
                    error: { type: string }
    GroupList:
      description: Lista de grupos
      content:
        application/json:
          schema:
            type: array
            items: { $ref: "#/components/schemas/GroupInfo" }

paths:
  /api/config:
    get:
      tags: [Sessões]
      summary: Configuração do servidor (limite de chamadas simultâneas)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  maxCallsPerSession: { type: integer, example: 8, description: "Máx. de chamadas simultâneas por sessão (0 = ilimitado)" }
                  defaultTransport: { type: string, example: "websocket", description: "Transporte de mídia padrão (ex.: websocket); o widget usa p/ decidir WS vs WebRTC" }
                  version: { type: string, example: "develop", description: "Build rodando (canal: develop/vX.Y.Z)" }
                  commit: { type: string, example: "c9ac957", description: "SHA do commit do build" }
                  groupCalls: { type: boolean, example: false, description: "Chamada em grupo (experimental) habilitada nesta instância (WACALLS_GROUP_CALLS)" }
                  publicIp: { type: string, example: "203.0.113.10", description: "IP público anunciado no WebRTC/SIP (só quando conhecido)" }
                  publicIpSource: { type: string, example: "stun:stun.l.google.com:19302", description: "De onde veio o publicIp (env, interface, stun:…, http:…)" }

  /api/widget-key:
    get:
      tags: [Widget]
      summary: Chave de widget ESTÁTICA da instância (só com a chave-mestra)
      description: >
        Devolve `WACALLS_WIDGET_KEY`, que libera só a superfície do widget (eventos SSE,
        resolve e rotas de chamada) para a instância inteira. Se a variável não estiver
        definida, responde 409 apontando para `POST /api/widget-tokens` (recomendado).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  widgetKey: { type: string }
                  scope: { type: string, example: instance }
        "409":
          description: WACALLS_WIDGET_KEY não configurada
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: widget_key_not_configured }
                  message: { type: string }

  /api/widget-tokens:
    post:
      tags: [Widget]
      summary: Gera um token de widget EFÊMERO escopado a uma conta do Chatwoot (só com a chave-mestra)
      description: >
        Token HMAC auto-contido que libera só a superfície do widget. No SSE (`/api/events`)
        ele só recebe eventos da própria conta: o `accountId` da query (ou derivado do
        clientId `astrachat_accN`) precisa bater com o do token, senão 403
        `{"error":"account_scope_mismatch"}`. Use o token como `X-API-Key` ou `?apiKey=`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountId]
              properties:
                accountId: { type: integer, minimum: 1, example: 4 }
                inboxId: { type: integer, example: 7, description: "Opcional (vai nas claims)" }
                ttlSeconds: { type: integer, default: 3600, maximum: 86400, description: "Validade (padrão 1h, teto 24h)" }
      responses:
        "200":
          description: Token gerado
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, example: "wt1.eyJhY2MiOjR9.xxxx" }
                  accountId: { type: integer }
                  inboxId: { type: integer }
                  expiresAt: { type: string, format: date-time }
                  scope: { type: string, example: account }
        "400": { description: "accountId é obrigatório (> 0)" }

  /api/sessions:
    get:
      tags: [Sessões]
      summary: Lista as contas
      description: >
        ⚠️ Rota administrativa: cada item expõe as credenciais SIP da sessão
        (`sip_user`/`sip_pass` e `sip_ext_user`/`sip_ext_pass`). Não exponha a chave-mestra
        a clientes finais.
      parameters: [{ $ref: "#/components/parameters/ClientId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
    post:
      tags: [Sessões]
      summary: Cria uma conta
      parameters: [{ $ref: "#/components/parameters/ClientId" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, example: "Minha conta" }
      responses:
        "200":
          description: Criada
          content:
            application/json:
              schema:
                type: object
                properties: { id: { type: string } }

  /api/sessions/{sid}/recording:
    get:
      tags: [Sessões]
      summary: Estado da gravação de chamadas da conta
      parameters:
        - { $ref: "#/components/parameters/Sid" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { enabled: { type: boolean } }
    put:
      tags: [Sessões]
      summary: Liga/desliga a gravação de chamadas da conta
      description: |
        Quando ligado, TODAS as chamadas desta conta são gravadas. No fim de cada
        chamada o MP3 vira uma **nota privada** na conversa do número no Chatwoot
        (se configurado) e um evento `recording` é enviado no webhook da sessão.
        O áudio também fica em `GET /recordings/{callId}.mp3`.
      parameters:
        - { $ref: "#/components/parameters/Sid" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties: { enabled: { type: boolean, example: true } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { enabled: { type: boolean } }

  /api/sessions/{sid}/proxy:
    get:
      tags: [Sessões]
      summary: Proxy de saída da conexão da conta
      parameters:
        - { $ref: "#/components/parameters/Sid" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  proxy: { type: string, example: "socks5://user:pass@host:1080" }
                  enabled: { type: boolean }
    put:
      tags: [Sessões]
      summary: Define/remove o proxy da conexão (http/https/socks5)
      description: |
        A conexão do WhatsApp desta conta (websocket + mídia) passa a sair pelo
        proxy informado. Trocar reconecta a sessão automaticamente. Envie `""`
        para voltar à conexão direta.
      parameters:
        - { $ref: "#/components/parameters/Sid" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proxy]
              properties:
                proxy: { type: string, example: "socks5://user:pass@host:1080", description: "vazio = sem proxy" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  proxy: { type: string }
                  enabled: { type: boolean }
        "400": { description: URL/scheme de proxy inválido }

  /api/sessions/{sid}/broadcast:
    post:
      tags: [Sessões]
      summary: Disparo em massa de ligações com áudio OU vídeo pré-gravado
      description: |
        Liga para cada número e, ao atender, toca a mídia pré-gravada e desliga ao
        fim. Áudio (padrão) toca o som no codec do WhatsApp. Com `video:true`, faz
        ligação de VÍDEO: o mesmo arquivo é decodificado em frames H264 (160x120,
        15fps) e injetado na chamada; se o arquivo tiver faixa de áudio, ela toca
        junto. Concorrência limitada ao máximo de chamadas simultâneas da conta.
        Emite eventos `broadcast` no webhook da sessão
        (ringing/answered/completed/no-answer/failed) para rastrear o lote.

        ⚠️ Use apenas com contatos que consentiram (opt-in). Ligação em massa não
        solicitada viola o WhatsApp (risco de ban) e a legislação (Anatel/CDC/LGPD).
      parameters:
        - { $ref: "#/components/parameters/Sid" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [numbers]
              properties:
                audio_url: { type: string, description: "URL da mídia (áudio, ou o VÍDEO quando video:true) — mais leve p/ lotes" }
                audio_base64: { type: string, description: "ou a mídia em base64" }
                video: { type: boolean, default: false, description: "true = ligação de VÍDEO tocando o arquivo (frames H264 preservando a proporção + áudio do arquivo)" }
                video_max: { type: integer, default: 180, description: "QUALIDADE (vídeo): lado maior em px, preservando proporção (120-480)." }
                video_bitrate: { type: integer, default: 48, description: "QUALIDADE (vídeo): bitrate alvo em kbps (40-1200). Padrão 48 (fluido via relay). OBS: áudio e vídeo DIVIDEM o canal do relay (~56-60k total); subir muito trava." }
                video_fps: { type: integer, default: 15, description: "QUALIDADE (vídeo): quadros por segundo (8-30)." }
                numbers: { type: array, items: { type: string }, example: ["5561999998888", "5561999997777"] }
                concurrency: { type: integer, default: 1, maximum: 16, description: "ligações simultâneas (máx. 16 e limitado ao máx. da conta)" }
                gap_ms: { type: integer, default: 1500, description: "intervalo (+jitter) entre disparos" }
                max_ring_ms: { type: integer, default: 45000, description: "timeout de toque → no-answer" }
                hangup_after_ms: { type: integer, default: 0, description: "corta após N ms (0 = ao fim do áudio)" }
      responses:
        "200":
          description: Campanha iniciada
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaignId: { type: string }
                  total: { type: integer }
                  video: { type: boolean }
                  seconds: { type: integer, description: "Duração do áudio decodificado (quando há áudio)" }
                  videoFrames: { type: integer, description: "Frames H264 decodificados (só com video:true)" }
        "400": { description: Áudio/numbers inválido }

  /api/sessions/{sid}/broadcast/{cid}:
    get:
      tags: [Sessões]
      summary: Status de uma campanha de disparo
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { name: cid, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaignId: { type: string }
                  total: { type: integer }
                  done: { type: boolean }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        number: { type: string, description: "Como foi informado" }
                        to: { type: string, description: "JID efetivamente discado" }
                        callId: { type: string }
                        status: { type: string, enum: [queued, ringing, answered, completed, no-answer, failed], example: completed }
                        durationMs: { type: integer }
                        error: { type: string, description: "Motivo da falha (status=failed)" }
        "404": { description: Campanha não encontrada }

  /recordings/{id}:
    get:
      tags: [Sessões]
      summary: Baixa o MP3 de uma gravação (rota pública / capability)
      description: "Fora de /api/ (sem API key). O id (callId) é não-enumerável e atua como capability."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, example: "abc123.mp3" }
      responses:
        "200":
          description: Áudio MP3
          content:
            audio/mpeg: { schema: { type: string, format: binary } }
        "404": { description: Não encontrado }

  /api/sessions/{sid}:
    delete:
      tags: [Sessões]
      summary: Remove a conta
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      responses:
        "204": { description: Removida }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/sessions/{sid}/pair:
    post:
      tags: [Sessões]
      summary: Inicia o pareamento (QR sai via SSE)
      description: Dispara a geração do QR Code; acompanhe os eventos `session-qr` / `auth-state` em `/api/events`.
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      responses:
        "204": { description: Pareamento iniciado }
        "400":
          description: "Sessão inexistente ou já pareada"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/sessions/{sid}/logout:
    post:
      tags: [Sessões]
      summary: Desconecta a conta (mantém a sessão)
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      responses:
        "204": { description: Desconectada }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/sessions/{sid}/calls/group:
    post:
      tags: [Chamadas]
      summary: "[EXPERIMENTAL] Inicia uma chamada em GRUPO (áudio + vídeo)"
      description: >
        Cria uma chamada em grupo. Dois modos: (1) ad-hoc, com `numbers` (mín. 2 números);
        (2) `groupJid` de um grupo existente — liga para os membros do grupo (exceto a
        própria conta) e preenche o roster (`GET .../calls/group/roster`). Se `groupJid`
        vier, `numbers` é ignorado. Máximo de 31 destinos (o excedente é cortado).
        EXPERIMENTAL e desligado por
        padrão — requer a env `WACALLS_GROUP_CALLS=1` no servidor; sem ela retorna 501.
        O control plane (offer, roster, troca da chave de epoch) e a criptografia estão
        implementados e validados; o acoplamento com o relay de grupo precisa de
        validação em chamada real.
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "Informe `numbers` OU `groupJid`."
              properties:
                numbers:
                  type: array
                  items: { type: string }
                  minItems: 2
                  maxItems: 31
                  example: ["5511999990001", "5511999990002"]
                  description: "Modo ad-hoc: 2 a 31 números"
                groupJid: { type: string, example: "120363000000000000@g.us", description: "Modo grupo: liga para os membros deste grupo (precisa de 2+ além de você)" }
                video: { type: boolean, default: false }
      responses:
        "200":
          description: Offer de grupo enviado
          content:
            application/json:
              schema:
                type: object
                properties:
                  callId: { type: string }
                  targets: { type: integer, description: "Destinos efetivamente chamados (máx. 31)" }
                  video: { type: boolean }
        "400": { description: "groupJid inválido ou menos de 2 destinos" }
        "501": { description: Chamada em grupo desligada (experimental) }
        "502": { description: "Falha ao ler o grupo (groupJid) ou ao enviar o offer" }
        "503": { $ref: "#/components/responses/NotPaired" }
  /api/sessions/{sid}/calls/group/end:
    post:
      tags: [Chamadas]
      summary: "[EXPERIMENTAL] Encerra a chamada em grupo ativa"
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      responses:
        "200":
          description: Encerrada
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string, example: ended } } }
        "404": { description: Nenhuma chamada em grupo ativa }
        "501": { description: Chamada em grupo desligada (experimental) }
  /api/sessions/{sid}/calls/group/ws:
    get:
      tags: [Chamadas]
      summary: "[EXPERIMENTAL] WebSocket de ÁUDIO da chamada em grupo (PCM16)"
      description: >
        Upgrade WebSocket (subprotocolo `pcm16`) para o atendente OUVIR o mix de áudio
        de todos os participantes e FALAR pelo microfone do navegador. Full-duplex com
        frames binários PCM16 mono. Requer `WACALLS_GROUP_CALLS=1` e uma chamada de
        grupo ativa. Query opcional `?events=1` habilita eventos de texto no stream.
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
        - name: events
          in: query
          required: false
          schema: { type: string, enum: ["1", "true"] }
          description: Habilita eventos de texto no stream
      responses:
        "101": { description: Switching Protocols (WebSocket) }
        "404": { description: Nenhuma chamada em grupo ativa }
        "501": { description: Chamada em grupo desligada (experimental) }
  /api/sessions/{sid}/calls/group/video-ws:
    get:
      tags: [Chamadas]
      summary: "[EXPERIMENTAL] WebSocket de VÍDEO da chamada em grupo (H264)"
      description: >
        Upgrade WebSocket (subprotocolo `h264-group`) para transportar vídeo H264
        (Annex-B) entre o navegador e o gateway. gateway→navegador: frames binários
        `[1 byte len(pid)][pid ascii][access unit H264]` (um por participante);
        navegador→gateway: access unit H264 puro (câmera do atendente). Separado do WS
        de áudio. Requer `WACALLS_GROUP_CALLS=1` e uma chamada de grupo ativa.


        Frames de TEXTO (JSON) de controle, gateway→navegador:
        `{"type":"keyframe_request"}` (um participante pediu keyframe da câmera),
        `{"type":"video_state","pid":"..","state":N}` (participante ligou 1 / desligou 0 ou 6 a câmera),
        `{"type":"orientation","pid":"..","orientation":N}` (rotação 0..3),
        `{"type":"participant_left","pid":".."}`.
        Navegador→gateway: `{"type":"pli","pid":".."}` pede keyframe ao participante (`""` = todos).
        O socket é fechado quando a chamada de grupo termina.
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      responses:
        "101": { description: Switching Protocols (WebSocket) }
        "404": { description: Nenhuma chamada em grupo ativa }
        "501": { description: Chamada em grupo desligada (experimental) }
  /api/sessions/{sid}/calls/group/roster:
    get:
      tags: [Chamadas]
      summary: "[EXPERIMENTAL] Roster da chamada em grupo (número do LID → telefone + nome)"
      description: >
        Devolve o mapa número-do-LID → telefone e nome dos participantes da chamada de
        grupo ativa, para o painel rotular os vídeos com número+nome em vez do @lid.
        Só é preenchido no modo `groupJid` (no modo ad-hoc com `numbers` vem `{}`).
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  roster:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        phone: { type: string, example: "556199999999" }
                        name: { type: string, example: "Fulano" }
  /api/sip/status:
    get:
      tags: [SIP]
      summary: Status do gateway SIP (registros e chamadas ativas)
      description: >
        Estado global do gateway SIP (sipgo nativo, sem Asterisk): se está ligado, a
        porta, os registros (modelo 1 — PBX registrado aqui) e as chamadas SIP ativas.
        Com o gateway desligado a resposta é só `{"enabled": false, "message": "SIP Gateway not started"}`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean, example: true }
                  message: { type: string, description: "Só quando enabled=false" }
                  port: { type: integer, example: 5060 }
                  registrations:
                    type: array
                    items:
                      type: object
                      properties:
                        sip_user: { type: string }
                        session_id: { type: string }
                        contact: { type: string }
                  active_calls:
                    type: array
                    items:
                      type: object
                      properties:
                        sip_call_id: { type: string }
                        session_id: { type: string }
                        wa_call_id: { type: string }
                        from: { type: string }
                        to: { type: string }
  /api/sessions/{sid}/sip:
    get:
      tags: [SIP]
      summary: "SIP modelo 1 — credenciais p/ um PBX/softphone registrar NESTA sessão"
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sip_user: { type: string }
                  sip_pass: { type: string }
                  sip_url: { type: string, description: "URL/host onde o PBX/softphone registra" }
                  sip_realm: { type: string, example: "astracalls" }
                  sip_port: { type: integer, example: 5060 }
                  codecs: { type: array, items: { type: string }, example: ["PCMU/8000"] }
                  session_id: { type: string }
    post:
      tags: [SIP]
      summary: "SIP modelo 1 — grava as credenciais de registro desta sessão"
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sip_user: { type: string }
                sip_pass: { type: string }
                sip_url: { type: string }
      responses:
        "200":
          description: Atualizado
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string, example: updated } } }
        "400": { description: Body inválido }
  /api/sessions/{sid}/sip-ext:
    get:
      tags: [SIP]
      summary: "SIP modelo 2 — config de registro desta sessão num PBX EXTERNO"
      description: >
        Modelo 2 (UAC): a sessão se registra como ramal/tronco num PBX do cliente
        (sipgo nativo, SIP puro + RTP, sem Asterisk por baixo). O campo `proxy`
        (outbound proxy) separa o SERVIDOR do DOMÍNIO — necessário em FreePBX e
        troncos hospedados (registra como `user@host`, mas manda os pacotes pro proxy).
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  host: { type: string, description: "Domínio/host do PBX (vai na URI user@host)" }
                  port: { type: integer, example: 5060 }
                  user: { type: string }
                  pass: { type: string }
                  dest: { type: string, description: "Ramal/fila que toca quando chega chamada do WhatsApp (opcional)" }
                  proxy: { type: string, description: "Outbound proxy host[:porta] — p/ onde enviar REGISTER/INVITE; vazio = usa host" }
                  status: { type: string, example: "registered", description: "registering/registered/failed" }
                  error: { type: string }
                  advertise: { type: string, description: "host:porta SIP anunciado no Contact" }
                  inboundMode: { type: string, enum: [originate, agent, auto], description: "O que fazer com INVITE entrante (ver /sip-agent)" }
                  agentAutoAnswer: { type: boolean }
                  agentRingTimeoutSeconds: { type: integer }
    post:
      tags: [SIP]
      summary: "SIP modelo 2 — grava/aplica o registro no PBX externo"
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "`host` e `user` só são obrigatórios com `enabled: true`."
              properties:
                enabled: { type: boolean }
                host: { type: string, example: "pbx.cliente.com" }
                port: { type: integer, default: 5060 }
                user: { type: string, example: "1001" }
                pass: { type: string }
                dest: { type: string, example: "600" }
                proxy: { type: string, example: "sip.provedor.com:5060", description: "Outbound proxy (host[:porta]); vazio = usa host" }
                inboundMode: { type: string, enum: [originate, agent, auto], description: "Opcional; ausente = mantém. Ver /sip-agent" }
                agentAutoAnswer: { type: boolean, description: "Opcional; ausente = mantém" }
                agentRingTimeoutSeconds: { type: integer, description: "Opcional; ausente = mantém" }
      responses:
        "200":
          description: Atualizado
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string, example: updated } } }
        "400": { description: "host e usuário são obrigatórios (com enabled=true) / body inválido" }
  /api/sessions/{sid}/sip-agent:
    get:
      tags: [SIP]
      summary: "SIP modo agente — o que fazer com a ligação que CHEGA no ramal"
      description: >
        `originate` (padrão): o INVITE é uma ordem de discar no WhatsApp para o número do
        Request-URI (gateway PBX→WhatsApp). `agent`: o AstraCalls ATENDE o INVITE e entrega a
        chamada ao agente de voz como uma chamada recebida comum — evento `incoming` no SSE
        (`source: "sip"`, `phone` = número do From/P-Asserted-Identity, bloco `sip`),
        `POST /calls/{id}/accept` responde 200 OK, `GET /calls/{id}/ws` fala PCM16 16 kHz,
        `DELETE /calls/{id}` manda BYE, `POST /calls/{id}/reject` responde 486 (603 com
        `{"reason":"decline"}`). `auto`: agente quando ligaram para o próprio ramal/usuário SIP,
        originate quando o destino é outro número. Vale para os dois modelos (PBX registrado em
        nós ou nós registrados no PBX). Codec G.711 PCMU/PCMA conforme a oferta; DTMF
        (telephone-event) chega no WS como `{"type":"dtmf","digit":"5"}`; a ponte pode mandar
        `{"type":"clear"}` para descartar o áudio ainda não tocado. Chamadas SIP e WhatsApp
        dividem o limite WACALLS_MAX_CALLS (acima dele: 486).
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SIPAgentConfig" }
    post:
      tags: [SIP]
      summary: "SIP modo agente — altera só o modo (não mexe no registro no PBX)"
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SIPAgentConfig" }
      responses:
        "200":
          description: Config em vigor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SIPAgentConfig" }
        "400": { description: "inboundMode inválido ou agentRingTimeoutSeconds fora de 0..600" }
  /api/sessions/{sid}/restriction-status:
    get:
      tags: [Sessões]
      summary: Estado de restrição/shadow-ban (time-lock 463) do número
      description: >
        Informa se o WhatsApp aplicou uma restrição de alcance (time-lock / 463)
        neste número — quando ativa, mensagens e chamadas para quem ainda não te
        respondeu podem "sumir" em silêncio. O WhatsApp só EMPURRA esse estado (não
        há consulta ativa no protocolo), então o retorno é o do último evento
        recebido (em cache). Com `?peer=<telefone>` também diz se há token de
        privacidade e mapeamento LID para aquele contato (diagnóstico anti-463).
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
        - name: peer
          in: query
          required: false
          schema: { type: string }
          description: Telefone do contato para checar token/LID (ex. 5511999999999)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: { type: string, example: "astrachat_acc12" }
                  restriction:
                    type: object
                    properties:
                      active: { type: boolean, example: true }
                      enforcement_type: { type: string, example: "reachout_timelock" }
                      ends_at: { type: integer, example: 1730600000000, description: "epoch ms (0 se desconhecido)" }
                      seconds_remaining: { type: integer, example: 54231 }
                      updated_at: { type: integer, example: 1730545769000 }
                  peer:
                    type: object
                    description: Só quando ?peer= é passado
                    properties:
                      pn: { type: string, example: "5511999999999@s.whatsapp.net" }
                      lid: { type: string }
                      lid_mapped: { type: boolean }
                      has_tctoken: { type: boolean }
        "404": { description: Sessão inexistente }
  /api/sessions/{sid}/calls:
    get:
      tags: [Chamadas]
      summary: Quantas chamadas ativas a sessão tem (e o limite)
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  active: { type: integer, example: 2 }
                  maxCallsPerSession: { type: integer, example: 8 }
    post:
      tags: [Chamadas]
      summary: Inicia uma chamada (faz o número de destino tocar)
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartCallRequest" }
      responses:
        "200":
          description: Chamada iniciada
          content:
            application/json:
              schema:
                type: object
                properties:
                  call:
                    type: object
                    properties: { callId: { type: string } }
        "400": { description: phone required }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { description: "max concurrent calls (limite maxCallsPerSession atingido)" }
        "503": { description: Conta não pareada }

  /api/sessions/{sid}/calls/{id}/accept:
    post:
      tags: [Chamadas]
      summary: Atende uma chamada recebida
      description: Reivindica a chamada para o `X-Client-Id` (evita dois atendentes pegarem a mesma) e atende no WhatsApp.
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/CallId" }
        - { $ref: "#/components/parameters/ClientId" }
      responses:
        "200":
          description: Atendida
          content:
            application/json:
              schema:
                type: object
                properties:
                  call: { type: object, properties: { callId: { type: string } } }
        "404": { description: "no such call" }
        "409": { description: "claimed by another client (outro atendente já pegou)" }
        "500": { description: Falha ao atender no WhatsApp }

  /api/sessions/{sid}/calls/{id}/reject:
    post:
      tags: [Chamadas]
      summary: Rejeita uma chamada recebida
      description: "O id é o mesmo do evento `incoming`/`call-list`. Envia o <reject> ao WhatsApp."
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/CallId" }
        - { $ref: "#/components/parameters/ClientId" }
      responses:
        "200":
          description: Rejeitada
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string, example: ok } } }
        "404":
          description: "Chamada inexistente — recusa NÃO aplicada"
          content:
            application/json:
              schema: { type: object, properties: { error: { type: string, example: "no such call" }, status: { type: string, example: not_applied } } }
        "409":
          description: "Falha ao enviar o reject — recusa NÃO aplicada"
          content:
            application/json:
              schema: { type: object, properties: { error: { type: string }, status: { type: string, example: not_applied } } }

  /api/sessions/{sid}/calls/{id}/video/{action}:
    post:
      tags: [Chamadas]
      summary: Negociação de vídeo no meio de uma chamada ativa (upgrade/downgrade)
      description: >
        Controla o vídeo durante uma chamada de áudio já ativa.
        `action`:
        `request` pede à outra ponta um upgrade de áudio→vídeo;
        `accept` aceita um pedido de upgrade recebido (liga a câmera);
        `reject` recusa o pedido recebido;
        `stop` desliga o próprio vídeo (downgrade para áudio).
        O evento SSE `video-state` avisa a UI sobre pedidos recebidos e a câmera do peer.
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/CallId" }
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [request, accept, reject, stop] }
        - { $ref: "#/components/parameters/ClientId" }
      responses:
        "200": { description: Ação aplicada }
        "404": { description: Chamada inexistente }
        "409": { description: Não há chamada ativa para negociar vídeo }

  /api/sessions/{sid}/calls/{id}:
    delete:
      tags: [Chamadas]
      summary: Encerra a chamada
      description: Idempotente — responde 204 mesmo se a chamada não existir (ou já tiver terminado).
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/CallId" }
        - { $ref: "#/components/parameters/ClientId" }
      responses:
        "204": { description: Encerrada }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/sessions/{sid}/calls/{id}/mute:
    post:
      tags: [Chamadas]
      summary: Anuncia ao interlocutor o estado do nosso microfone (mute)
      description: >
        Envia o `<mute_v2>` ao WhatsApp para o outro lado ver o indicador de microfone
        desligado. Não corta o áudio por si só. O mute do PEER chega por SSE como
        `{"type":"call-action","kind":"peer-mute","state":true|false}`.
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/CallId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { muted: { type: boolean, example: true } } }
      responses:
        "200":
          description: Anunciado
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string, example: ok }, muted: { type: boolean } } }
        "404": { description: "no such call" }
        "409": { description: Não foi possível anunciar (estado da chamada) }

  /api/sessions/{sid}/calls/{id}/hand:
    post:
      tags: [Chamadas]
      summary: Levanta/abaixa a mão na chamada
      description: >
        Anuncia ao interlocutor a mão levantada/baixada. A mão do PEER chega por SSE como
        `{"type":"call-action","kind":"peer-hand","state":true|false}`.
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/CallId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { raised: { type: boolean, example: true } } }
      responses:
        "200":
          description: Anunciado
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string, example: ok }, raised: { type: boolean } } }
        "404": { description: "no such call" }
        "409": { description: Não foi possível anunciar (estado da chamada) }

  /api/sessions/{sid}/messages/text:
    post:
      tags: [Mensagens]
      summary: Envia uma mensagem de texto
      description: "Idempotente com `X-Message-ID`/`?id=` (ver introdução)."
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, text]
              properties:
                to: { type: string, example: "5561999999999", description: "Número (DDI+DDD) ou JID completo (...@s.whatsapp.net / ...@g.us)" }
                text: { type: string, example: "Olá!" }
                quotedMessageId: { type: string, description: "Cita (responde) a mensagem com esse id. O remetente/conteúdo da citada é resolvido automaticamente." }
                participant: { type: string, description: "Opcional. Em grupo, o JID de quem enviou a mensagem citada (só se a resolução automática não achar)." }
                fromMe: { type: boolean, description: "Opcional. true se a mensagem citada foi enviada por você." }
                mentions: { type: array, items: { type: string }, description: "Números ou JIDs a mencionar (@). O texto deve conter os @ correspondentes. Em GRUPO, se omitido, o gateway detecta sozinho os `@<8..15 dígitos>` do texto.", example: ["5561999999999"] }
                mentionAll: { type: boolean, description: "GRUPO: marca TODOS os participantes (\"@todos\" nativo do WhatsApp: contextInfo.nonJidMentions=1 + participantes em mentionedJid). Sem @ no texto = marcação fantasma. Equivale a mentions:[\"all\"]. `@todos`/`@all`/`@everyone` no texto (inclusive pelo Chatwoot) também marca todos e vira o token `@all`.", example: true }
      responses:
        "200": { $ref: "#/components/responses/SendOK" }
        "503": { description: Conta não pareada }

  /api/sessions/{sid}/messages/disappearing:
    post:
      tags: [Mensagens]
      summary: Texto que some DEPOIS de lido (afterReadDuration)
      description: >
        Envia um texto que desaparece X segundos DEPOIS que o destinatário LÊ —
        diferente do temporário normal do WhatsApp, que conta a partir do envio.
        Bom para senha/código/link sensível. Só texto por enquanto.
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, text]
              properties:
                to: { type: string, example: "5561999999999" }
                text: { type: string, example: "sua senha: 1234" }
                afterReadSeconds: { type: integer, default: 5, description: "Segundos até sumir DEPOIS de lida (padrão 5)" }
      responses:
        "200": { $ref: "#/components/responses/SendOK" }
        "503": { description: Conta não pareada }

  /api/sessions/{sid}/messages/image:
    post:
      tags: [Mensagens]
      summary: Envia uma imagem
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/MediaBody"
                - type: object
                  properties:
                    caption: { type: string, example: "minha foto" }
      responses:
        "200": { $ref: "#/components/responses/SendOK" }

  /api/sessions/{sid}/messages/audio:
    post:
      tags: [Mensagens]
      summary: Envia um áudio (use ptt=true para nota de voz)
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/MediaBody"
                - type: object
                  properties:
                    ptt: { type: boolean, example: true, description: "true = nota de voz (push-to-talk)" }
                    seconds: { type: integer, description: "Duração em segundos. Se omitido numa nota de voz (ptt), é estimada a partir do OGG/Opus." }
                    waveform: { type: string, description: "Waveform em base64 (64 bytes, valores 0-100). Se omitido numa nota de voz, um aproximado é gerado para não ficar barra reta." }
      responses:
        "200": { $ref: "#/components/responses/SendOK" }

  /api/sessions/{sid}/messages/video:
    post:
      tags: [Mensagens]
      summary: Envia um vídeo
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/MediaBody"
                - type: object
                  properties:
                    caption: { type: string }
      responses:
        "200": { $ref: "#/components/responses/SendOK" }

  /api/sessions/{sid}/messages/document:
    post:
      tags: [Mensagens]
      summary: Envia um documento/arquivo
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/MediaBody"
                - type: object
                  properties:
                    filename: { type: string, example: "contrato.pdf", description: "Sem mimetype, o tipo é deduzido pela extensão" }
                    caption: { type: string, description: "Legenda (vai em documentWithCaptionMessage)" }
      responses:
        "200": { $ref: "#/components/responses/SendOK" }

  /api/sessions/{sid}/webhook:
    get:
      tags: [Webhook]
      summary: Consulta a URL de webhook da sessão
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookConfig" }
    post:
      tags: [Webhook]
      summary: Define a URL de webhook (recebe os eventos da sessão)
      description: |
        Eventos enviados (POST JSON) no formato `{ session, event, timestamp, data }`.
        `event` pode ser `message` (mensagem recebida, com `data.text`, `data.type`, `data.raw`...),
        `receipt` (confirmações de entrega/leitura) ou `group_participants` (entrada/saída/promoção
        em grupo, com `data.group`, `data.actor` e as listas `data.joined`/`data.left`/`data.promoted`/`data.demoted`).
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, example: "https://meu-sistema/webhook/wacalls", description: "Vazio = remove o webhook (igual ao DELETE)" }
                secret: { type: string, description: "Opcional. Assina cada entrega com HMAC-SHA256 no header X-Webhook-Signature: sha256=<hex>. Ausente = mantém o atual; \"\" = remove." }
                events: { type: array, items: { type: string }, description: "Opcional. Só entrega estes tipos de evento (vazio = todos).", example: ["message", "receipt"] }
                ignoreGroups: { type: boolean, description: "Opcional. true = não entrega NENHUM evento de grupo (mensagem, receipt, reação, group_participants… de chat @g.us). Ausente = mantém o atual.", example: true }
      responses:
        "200":
          description: Salvo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookConfig" }
        "400": { description: Body inválido }
    delete:
      tags: [Webhook]
      summary: Remove o webhook da sessão
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      responses:
        "204": { description: Removido }

  /api/sessions/{sid}/chatwoot:
    get:
      tags: [Chatwoot]
      summary: Consulta a integração Chatwoot da sessão (token omitido)
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean, description: "true = configuração válida/ativa" }
                  chatwoot: { $ref: "#/components/schemas/ChatwootConfig" }
    post:
      tags: [Chatwoot]
      summary: Conecta a sessão a uma inbox do Chatwoot (canal API)
      description: |
        Configura a integração. Crie no Chatwoot uma inbox do tipo **API**, pegue o
        `inbox_id`, `inbox_identifier`, o `account_id` e um `account_token` (Access Token
        do perfil/agente). Depois aponte o **webhook da inbox** para
        `POST /api/sessions/{sid}/chatwoot/webhook` para as respostas dos agentes saírem no WhatsApp.

        Os campos ausentes no payload **mantêm o valor atual** (não são zerados), então dá para
        alterar só uma flag sem reenviar a configuração inteira. Para limpar tudo, use o `DELETE`.
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, account_id, account_token, inbox_id]
              properties:
                url: { type: string, example: "https://chatwoot.seudominio.com" }
                account_id: { type: integer, example: 1 }
                account_token: { type: string, example: "xxxxxxxxxxxxxxxx", description: "Vazio/ausente = mantém o token atual (útil ao editar)" }
                inbox_id: { type: integer, example: 5 }
                inbox_identifier: { type: string, example: "abcd1234" }
                groups: { type: boolean, default: false, description: "Abrir conversas de GRUPOS no Chatwoot. Cada mensagem é prefixada com o autor (*Nome*:) e leva em content_attributes: wa_participant (JID de envio), wa_participant_phone (telefone real ou vazio), wa_participant_lid, wa_participant_name. No envio pelo webhook, @<número> no texto vira menção." }
                channels: { type: boolean, default: false, description: "Abrir conversas de CANAIS (newsletters) no Chatwoot" }
                groups_skip_incoming: { type: boolean, default: false, description: "Com groups=true, NÃO reflete as mensagens dos outros membros do grupo — só posta as msgs do próprio aparelho (nota privada) e os avisos de entrada/saída/admin. Evita duplicação quando outra fonte já traz as mensagens do grupo pro mesmo inbox" }
                sign_msg: { type: boolean, default: false, description: "Assinatura do atendente: prefixa *Nome*\\n no texto e na legenda de mídia das mensagens de SAÍDA (o nome vem do sender do webhook; não fica salvo na conversa do Chatwoot)" }
                always_online: { type: boolean, default: false, description: "Mantém a presença da conta sempre como online (reenvia a cada reconexão)" }
                read_messages: { type: boolean, default: false, description: "Confirma leitura automática das mensagens recebidas (envia recibo de leitura)" }
                mirror_api: { type: boolean, default: false, description: "Reflete no Chatwoot, como NOTA PRIVADA, as mensagens enviadas por esta API (ex.: n8n) — mesmo tratamento das enviadas pelo aparelho, para o atendente ver o que foi disparado por fora. Não reenvia nada ao contato. As mensagens do agente do Chatwoot nunca são refletidas (já estão na conversa)" }
                import_history: { type: boolean, default: false, description: "Ao conectar a conta, importa para o Chatwoot o histórico de conversas 1:1 que o WhatsApp envia (HistorySync), reconstruindo a timeline com a direção real (recebidas/enviadas) e a data original no texto. Não reenvia nada ao contato (as enviadas levam source_id, que bloqueia o reenvio). ATENÇÃO: o histórico só chega ao PAREAR o dispositivo — ative antes de conectar a conta" }
                import_history_days: { type: integer, default: 30, description: "Janela do histórico a importar, em dias (teto de 365). Também há um teto de 500 mensagens por conversa" }
      responses:
        "200":
          description: Conectado (account_token omitido na resposta)
          content:
            application/json:
              schema:
                type: object
                properties:
                  chatwoot: { $ref: "#/components/schemas/ChatwootConfig" }
        "400": { description: Campos obrigatórios faltando }
    delete:
      tags: [Chatwoot]
      summary: Desconecta a integração Chatwoot
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      responses:
        "204": { description: Desconectado }

  /api/sessions/{sid}/chatwoot/groups/{gid}/open:
    post:
      tags: [Chatwoot]
      summary: Abre (sob demanda) uma conversa de GRUPO no Chatwoot
      description: |
        Cria/garante o contato (o próprio grupo) e uma conversa na inbox, sem
        esperar chegar mensagem. Requer Chatwoot configurado na sessão.
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/Gid" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  contactId: { type: integer }
                  conversationId: { type: integer }
                  chatId: { type: string, example: "120363000000000000@g.us" }
        "400": { description: Chatwoot não configurado ou JID inválido }

  /api/sessions/{sid}/chatwoot/channels/{id}/open:
    post:
      tags: [Chatwoot]
      summary: Abre (sob demanda) uma conversa de CANAL no Chatwoot
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ChannelId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  contactId: { type: integer }
                  conversationId: { type: integer }
                  chatId: { type: string, example: "120363000000000000@newsletter" }
        "400": { description: Chatwoot não configurado ou JID inválido }

  /api/sessions/{sid}/chatwoot/webhook:
    post:
      tags: [Chatwoot]
      summary: Endpoint que recebe o webhook do Chatwoot (agente -> WhatsApp)
      description: |
        Configure este endereço como **webhook da inbox** no Chatwoot. Ao receber
        `message_created`/outgoing, envia a mensagem (texto e anexos) pelo WhatsApp.
        Rota liberada de API key (é chamada pelo próprio Chatwoot). Eventos que não
        precisam ser reenviados respondem 200 sem corpo.
      security: []
      parameters:
        - { $ref: "#/components/parameters/Sid" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: "Payload do webhook do Chatwoot" }
      responses:
        "200":
          description: Processado (ou ignorado)
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string, example: ok } } }
        "400": { description: Payload inválido }
        "404": { $ref: "#/components/responses/NotFound" }
        "502":
          description: Falha ao enviar ao WhatsApp
          content:
            application/json:
              schema: { type: object, properties: { error: { type: string }, status: { type: string, example: not_sent } } }

  /api/sessions/{sid}/chatwoot/import-history:
    post:
      tags: [Chatwoot]
      summary: Importar histórico AGORA (sob demanda, sessão já conectada)
      description: >
        Importa histórico sem precisar reparear. O WhatsApp só manda o histórico
        automaticamente no pareamento; este endpoint pede o histórico SOB DEMANDA
        (BuildHistorySyncRequest) para cada conversa 1:1 conhecida, usando a msg mais
        antiga que já temos como âncora e pedindo N mensagens mais antigas. A resposta
        chega em segundos/minutos e é importada automaticamente pro Chatwoot. Liga a
        flag import_history da sessão (se estiver desligada). Requer a integração
        Chatwoot configurada e ao menos uma mensagem conhecida do chat (âncora).
      parameters:
        - { $ref: "#/components/parameters/Sid" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                count: { type: integer, default: 100, description: "Mensagens por conversa (teto 500)" }
                chat: { type: string, description: "Importar só este chat (JID/telefone). Vazio = todas as 1:1 conhecidas." }
                maxChats: { type: integer, default: 50, description: "Máx. de conversas quando chat não é informado" }
      responses:
        "200":
          description: Pedido(s) enviado(s)
          content:
            application/json:
              schema:
                type: object
                properties:
                  requested: { type: integer, description: "Conversas pedidas. 0 = nenhuma mensagem conhecida para ancorar (ver note)" }
                  count_per_chat: { type: integer, description: "Ausente quando requested=0" }
                  note: { type: string }
        "400": { description: "Chatwoot não configurado / chat inválido" }
        "503": { description: "Sessão não conectada" }

  /api/sessions/{sid}/history:
    get:
      tags: [Eventos & Histórico]
      summary: Histórico de chamadas da conta (últimas 50)
      description: Histórico em memória (zera ao reiniciar o servidor), mais recentes primeiro.
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items: { $ref: "#/components/schemas/CallRecord" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/events:
    get:
      tags: [Eventos & Histórico]
      summary: Stream de eventos em tempo real (SSE)
      description: |
        Server-Sent Events. Cada evento chega numa linha `data: {json}` (não há linha
        `event:`); o tipo vai no campo JSON **`type`**:

        - `session-list` `{sessions:[Session]}` — lista de contas (também enviado ao conectar).
        - `session-qr` `{sessionId, qr}` — QR de pareamento.
        - `auth-state` `{sessionId, state, paired, qr, code?, passkey?}` — estado do pareamento
          (`code` = código de 8 caracteres; `passkey` = desafio WebAuthn com state=passkey_request).
        - `call-list` `{calls:[CallRecord]}` — chamadas ativas.
        - `call-status` `{sessionId, id, owner, status, peer, startedAt, held}`.
        - `call-ended` `{sessionId, id, owner, reason, endedAt}`.
        - `incoming` `{sessionId, id, peer, phone, name, video, offeredAt, source}` — chamada recebida. `source`: `whatsapp` ou `sip` (modo agente do SIP, com o bloco extra `sip: {callId, from, to, codec}` e `id` começando com `sip-`)
          (`phone`/`name` resolvidos; `peer` pode ser @lid).
        - `incoming-claimed` `{sessionId, id, owner}` — alguém atendeu.
        - `video-state` `{sessionId, id, kind, peerVideo, localVideo, upgradeIncoming, upgradeOutgoing, peerOrientation}`
          — negociação de vídeo (kind `upgrade-request` | `state`).
        - `call-action` `{sessionId, id, kind, state, count?}` — kind `peer-mute`, `peer-hand`,
          `spy` (com `count` de ouvintes) ou `silence`.
        - `call-volume` `{sessionId, id, level}`.
        - `call-transfer-offer` `{sessionId, id, peer, from, offeredAt}` — chamada transferida
          aguardando pickup (só o alvo recebe, se houver).
        - `call-transfer-claimed` `{sessionId, id, owner}`.
        - `call-webrtc-failed` `{sessionId, id, reason}` — chamada SIP (modo agente): o WebRTC do navegador não conectou (ICE). A ligação NÃO cai: volta para a espera com música; o painel pode repetir `POST /calls/{id}/webrtc`.

        Escopo por conta: com `accountId` (ou `X-Client-Id`/`clientId` no padrão
        `astrachat_accN`, de onde a conta N é derivada) só chegam os eventos de chamada das
        sessões daquela conta do Chatwoot. Sem conta = painel admin (recebe tudo). Com token
        de widget, a conta pedida precisa bater com a do token (senão 403).
      parameters:
        - name: clientId
          in: query
          schema: { type: string }
          description: "Identificador do cliente (alternativa ao header X-Client-Id). `astrachat_accN` deriva a conta N."
        - name: accountId
          in: query
          schema: { type: integer }
          description: Conta do Chatwoot para escopar os eventos de chamada.
        - { $ref: "#/components/parameters/ClientId" }
      responses:
        "200":
          description: Stream text/event-stream
          content:
            text/event-stream:
              schema: { type: string, example: "data: {\"type\":\"incoming\",\"sessionId\":\"abc\",\"id\":\"CALLID\",\"phone\":\"5561999999999\"}" }
        "403": { description: "account_scope_mismatch (token de widget de outra conta)" }

  # ===================== Mensagens (ações) =====================
  /api/sessions/{sid}/messages/location:
    post:
      tags: [Mensagens]
      summary: Envia uma localização
      parameters:
        - { $ref: "#/components/parameters/Sid" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, latitude, longitude]
              properties:
                to: { type: string, example: "5561999999999" }
                latitude: { type: number, example: -15.7942 }
                longitude: { type: number, example: -47.8822 }
                name: { type: string, example: "Praça dos Três Poderes" }
                address: { type: string, example: "Brasília - DF" }
      responses:
        "200": { $ref: "#/components/responses/SendOK" }

  /api/sessions/{sid}/messages/contact:
    post:
      tags: [Mensagens]
      summary: Envia um ou mais contatos (vcard)
      parameters:
        - { $ref: "#/components/parameters/Sid" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, contacts]
              properties:
                to: { type: string, example: "5561999999999" }
                contacts:
                  type: array
                  items:
                    type: object
                    properties:
                      fullName: { type: string, example: "João Silva" }
                      phone: { type: string, example: "5561988887777" }
                      vcard: { type: string, description: "vCard pronto (opcional; se ausente é montado a partir de fullName/phone)" }
      responses:
        "200": { $ref: "#/components/responses/SendOK" }

  /api/sessions/{sid}/messages/poll:
    post:
      tags: [Mensagens]
      summary: Envia uma enquete
      parameters:
        - { $ref: "#/components/parameters/Sid" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, name, options]
              properties:
                to: { type: string, example: "5561999999999" }
                name: { type: string, example: "Qual horário?" }
                options: { type: array, items: { type: string }, example: ["Manhã", "Tarde", "Noite"] }
                multipleAnswers: { type: boolean, example: false, description: "true = permite marcar várias opções" }
      responses:
        "200": { $ref: "#/components/responses/SendOK" }

  /api/sessions/{sid}/messages/poll-vote:
    post:
      tags: [Mensagens]
      summary: Vota numa enquete recebida
      description: |
        Vota numa enquete que chegou nesta sessão. Use o `pollMessageId` (o ID da
        mensagem da enquete — vem no webhook como `id` e no Chatwoot como
        `_PID: ..._`). Envie `selectedNames` vazio ou omita o campo para retirar o voto. A enquete
        precisa ter sido recebida por esta sessão (o segredo fica guardado).
      parameters:
        - { $ref: "#/components/parameters/Sid" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pollMessageId]
              properties:
                to: { type: string, example: "5561999999999", description: "opcional; padrão = o chat da enquete" }
                pollMessageId: { type: string, example: "3EB0C767D...", description: "ID da mensagem da enquete" }
                selectedNames: { type: array, items: { type: string }, example: ["Tarde"], description: "Opções escolhidas (pelo texto). Vazio/ausente = retira o voto" }
      responses:
        "200": { $ref: "#/components/responses/SendOK" }
        "404": { description: Enquete não encontrada pelo ID }

  /api/sessions/{sid}/messages/event-response:
    post:
      tags: [Mensagens]
      summary: Responde (RSVP) um evento recebido
      description: |
        Envia "Vou / Talvez / Não vou" para um evento recebido nesta sessão. Use
        o `eventMessageId` (vem no webhook como `id` e no Chatwoot como `_EID: ..._`).
        O evento precisa ter sido recebido por esta sessão (o segredo fica guardado).
      parameters:
        - { $ref: "#/components/parameters/Sid" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventMessageId, response]
              properties:
                to: { type: string, example: "5561999999999", description: "opcional; padrão = o chat do evento" }
                eventMessageId: { type: string, description: "ID da mensagem do evento" }
                response:
                  type: string
                  example: going
                  description: >-
                    going | not_going | maybe. Aliases aceitos (sem diferenciar maiúsculas):
                    going = vai, yes, sim, 1; not_going = "not going", nao_vai, "não vai", "nao vai", no, 2;
                    maybe = talvez, 3.
      responses:
        "200": { $ref: "#/components/responses/SendOK" }
        "400": { description: "eventMessageId obrigatório / response inválido" }
        "404": { description: Evento não encontrado pelo ID }

  /api/sessions/{sid}/messages/event:
    post:
      tags: [Mensagens]
      summary: Cria/envia um EVENTO (convite com data, local e link)
      description: >
        Envia uma EventMessage do WhatsApp. As respostas (RSVP) dos convidados chegam no
        webhook; para responder a um evento recebido use `POST .../messages/event-response`.
        Se a conta/WhatsApp não suportar o tipo, o erro do envio é devolvido (500).
      parameters:
        - { $ref: "#/components/parameters/Sid" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, name, startTime]
              properties:
                to: { type: string, example: "120363000000000000@g.us" }
                name: { type: string, example: "Reunião mensal" }
                description: { type: string }
                startTime: { type: integer, format: int64, example: 1767225600, description: "Início em epoch SEGUNDOS (obrigatório, > 0)" }
                endTime: { type: integer, format: int64, description: "Fim em epoch segundos (opcional)" }
                location: { type: string, description: "Nome/endereço do local (opcional)" }
                joinLink: { type: string, description: "Link da chamada (opcional)" }
                isCanceled: { type: boolean, default: false, description: "Marca o evento como cancelado" }
      responses:
        "200": { $ref: "#/components/responses/SendOK" }
        "400": { description: "name and startTime (epoch seconds) required" }
        "503": { $ref: "#/components/responses/NotPaired" }

  /api/sessions/{sid}/messages/link-preview:
    post:
      tags: [Mensagens]
      summary: Envia texto com prévia de link
      parameters:
        - { $ref: "#/components/parameters/Sid" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, url]
              properties:
                to: { type: string, example: "5561999999999" }
                url: { type: string, example: "https://exemplo.com" }
                text: { type: string, description: "Texto da mensagem (padrão = a própria URL)" }
                title: { type: string }
                description: { type: string }
      responses:
        "200": { $ref: "#/components/responses/SendOK" }

  /api/sessions/{sid}/messages/react:
    put:
      tags: [Mensagens]
      summary: Reage a uma mensagem (emoji; string vazia remove)
      parameters:
        - { $ref: "#/components/parameters/Sid" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, messageId, reaction]
              properties:
                to: { type: string, example: "5561999999999" }
                messageId: { type: string }
                reaction: { type: string, example: "👍" }
                participant: { type: string, description: "Em grupo: JID de quem enviou a mensagem" }
                fromMe: { type: boolean, description: "true se a mensagem é sua" }
      responses:
        "200": { $ref: "#/components/responses/SendOK" }

  /api/sessions/{sid}/messages/edit:
    put:
      tags: [Mensagens]
      summary: Edita uma mensagem já enviada
      parameters:
        - { $ref: "#/components/parameters/Sid" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, messageId, text]
              properties:
                to: { type: string, example: "5561999999999" }
                messageId: { type: string }
                text: { type: string, example: "texto corrigido" }
      responses:
        "200": { $ref: "#/components/responses/SendOK" }

  /api/sessions/{sid}/messages:
    get:
      tags: [Eventos & Histórico]
      summary: Mensagens de um chat (via query)
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { name: chatId, in: query, required: true, schema: { type: string }, description: "Número ou JID do chat" }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: raw, in: query, schema: { type: boolean }, description: "true inclui o proto bruto de cada mensagem" }
      responses:
        "200": { $ref: "#/components/responses/MessageList" }
    delete:
      tags: [Mensagens]
      summary: Apaga/revoga uma mensagem
      parameters:
        - { $ref: "#/components/parameters/Sid" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, messageId]
              properties:
                to: { type: string, example: "5561999999999" }
                messageId: { type: string }
                participant: { type: string }
                fromMe: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/SendOK" }

  /api/sessions/{sid}/messages/seen:
    post:
      tags: [Mensagens]
      summary: Marca mensagem(ns) como lida(s)
      parameters:
        - { $ref: "#/components/parameters/Sid" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              description: "Informe `messageId` e/ou `messageIds` (ao menos um id)."
              properties:
                to: { type: string, example: "5561999999999" }
                messageId: { type: string }
                messageIds: { type: array, items: { type: string } }
                participant: { type: string, description: "Em grupo: JID de quem enviou" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  ids: { type: array, items: { type: string }, description: "IDs marcados como lidos" }
        "400": { description: "messageId(s) required" }

  /api/sessions/{sid}/messages/typing:
    post:
      tags: [Mensagens]
      summary: Indica "digitando"/"gravando" (ou para)
      parameters:
        - { $ref: "#/components/parameters/Sid" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { type: string, example: "5561999999999" }
                typing: { type: boolean, example: true, description: "true = digitando; false = parou" }
                audio: { type: boolean, description: "true = mostra 'gravando áudio'" }
      responses:
        "200": { $ref: "#/components/responses/OkTrue" }

  /api/sessions/{sid}/messages/{id}/media:
    get:
      tags: [Mensagens]
      summary: Baixa os bytes de uma mídia RECEBIDA (imagem/áudio/vídeo/documento/sticker)
      description: |
        Decifra e devolve o arquivo original de uma mensagem de mídia recebida, a
        partir do `id` da mensagem (o mesmo `id` que veio no webhook `message`).
        Responde com o `Content-Type` correto e `Content-Disposition: inline`
        (use `?download=1` para forçar download como anexo). Retorna 404 se a
        mensagem não existe ou não tem mídia.
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { name: id, in: path, required: true, schema: { type: string }, description: "ID da mensagem (webhook message.data.id)" }
        - { name: download, in: query, required: false, schema: { type: string, enum: ["1", "true"] }, description: "Força download (anexo) em vez de inline" }
      responses:
        "200":
          description: Bytes do arquivo (Content-Type conforme a mídia)
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { description: Mensagem não encontrada ou sem mídia }
        "502": { description: "Falha ao baixar/decifrar a mídia no WhatsApp (ex.: mídia expirada)" }

  # ===================== Contatos =====================
  /api/sessions/{sid}/contacts/check:
    get:
      tags: [Contatos]
      summary: Verifica se o número existe no WhatsApp (retorna o JID canônico)
      description: |
        Consulta autoritativa (`IsOnWhatsApp`). Resolve o problema do 9º dígito (BR):
        devolve o JID real, independente de o número ter sido informado com ou sem o 9.
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { name: phone, in: query, required: true, schema: { type: string }, example: "5561999999999" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  query: { type: string }
                  exists: { type: boolean }
                  jid: { type: string, example: "556192264108@s.whatsapp.net" }
                  number: { type: string, example: "556192264108", description: "telefone canônico (com/sem 9º dígito como o WhatsApp registrou)" }
                  chatId: { type: string, example: "556192264108@c.us", description: "alias WAHA" }
                  lid: { type: string, example: "53863285534946@lid", description: "LID da conta quando o WhatsApp informa (vazio se não houver)" }
                  numberExists: { type: boolean, description: "alias de exists" }
                  verifiedName: { type: string }

  /api/sessions/{sid}/contacts:
    get:
      tags: [Contatos]
      summary: Lista os contatos conhecidos
      description: >
        Contatos guardados como `@lid` são mapeados para o telefone e deduplicados (um
        item por pessoa). `jid`/`number`/`id` usam o telefone quando conhecido; só caem no
        `@lid` quando não há telefone (compat). `phone` traz SÓ telefone real.
      parameters:
        - { $ref: "#/components/parameters/Sid" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    jid: { type: string, example: "556192264108@s.whatsapp.net", description: "telefone@s.whatsapp.net; @lid só quando não há telefone" }
                    number: { type: string, example: "556192264108", description: "telefone; dígitos do LID só quando não há telefone (compat)" }
                    phone: { type: string, description: "SÓ telefone real (\"\" se o LID não resolver)" }
                    lid: { type: string, description: "LID quando conhecido (\"\" senão)", example: "53863285534946@lid" }
                    fullName: { type: string }
                    firstName: { type: string }
                    pushName: { type: string }
                    businessName: { type: string }
                    id: { type: string, description: "alias WAHA (telefone@c.us; @lid quando não há telefone)" }
                    name: { type: string, description: "alias: fullName → pushName → firstName → businessName" }
                    pushname: { type: string, description: "alias de pushName" }

  /api/sessions/{sid}/contacts/{jid}:
    get:
      tags: [Contatos]
      summary: Info de um contato (status/About, foto, lid)
      description: >
        Aceita número (com ou sem o 9º dígito BR) ou `@lid`. `jid`/`number` saem no
        telefone canônico (como o WhatsApp registrou) quando conhecido.
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/Jid" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  jid: { type: string, example: "556192264108@s.whatsapp.net", description: "telefone canônico; o JID informado se não houver telefone" }
                  number: { type: string, example: "556192264108" }
                  phone: { type: string, description: "SÓ telefone real (\"\" se não resolver)" }
                  lid: { type: string, description: "LID quando conhecido (\"\" senão)" }
                  status: { type: string, description: "Recado/About" }
                  pictureId: { type: string }
                  id: { type: string, description: "alias WAHA (número@c.us)" }
        "404": { description: "not found" }

  /api/sessions/{sid}/contacts/{jid}/picture:
    get:
      tags: [Contatos]
      summary: URL da foto de perfil do contato
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/Jid" }
        - { name: preview, in: query, schema: { type: boolean }, description: "true = miniatura" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: 'Sem foto (ou privada): `{"url":"","profilePictureURL":""}`.'
                properties:
                  url: { type: string }
                  id: { type: string }
                  type: { type: string, example: image }
                  profilePictureURL: { type: string, description: "alias WAHA de url" }

  /api/sessions/{sid}/contacts/{jid}/block:
    post:
      tags: [Contatos]
      summary: Bloqueia o contato
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/Jid" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean }, blocked: { type: boolean, example: true } } }

  /api/sessions/{sid}/contacts/{jid}/unblock:
    post:
      tags: [Contatos]
      summary: Desbloqueia o contato
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/Jid" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean }, blocked: { type: boolean, example: false } } }

  /api/sessions/{sid}/blocklist:
    get:
      tags: [Contatos]
      summary: Lista os JIDs bloqueados
      parameters:
        - { $ref: "#/components/parameters/Sid" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { blocked: { type: array, items: { type: string }, description: "JIDs bloqueados (podem vir como @lid)" } }

  # ===================== Grupos =====================
  /api/sessions/{sid}/groups:
    get:
      tags: [Grupos]
      summary: Lista os grupos da conta
      parameters: [{ $ref: "#/components/parameters/Sid" }]
      responses:
        "200": { $ref: "#/components/responses/GroupList" }
    post:
      tags: [Grupos]
      summary: Cria um grupo
      parameters: [{ $ref: "#/components/parameters/Sid" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: "Turma 2026" }
                participants: { type: array, items: { type: string }, example: ["5561988887777", "5561966665555"] }
      responses:
        "200": { $ref: "#/components/responses/Group" }

  /api/sessions/{sid}/groups/join:
    post:
      tags: [Grupos]
      summary: Entra em um grupo por código/link de convite
      parameters: [{ $ref: "#/components/parameters/Sid" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, example: "https://chat.whatsapp.com/XXXXXXXX" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { jid: { type: string } } }

  /api/sessions/{sid}/groups/join-info:
    get:
      tags: [Grupos]
      summary: Info do grupo antes de entrar (via código)
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { name: code, in: query, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Group" }

  /api/sessions/{sid}/groups/{gid}:
    get:
      tags: [Grupos]
      summary: Info de um grupo
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/Gid" }
      responses:
        "200": { $ref: "#/components/responses/Group" }

  /api/sessions/{sid}/communities:
    post:
      tags: [Comunidades]
      summary: Cria uma comunidade
      description: |
        O grupo de avisos é criado automaticamente pelo WhatsApp junto com a comunidade.
        Nome até 25 caracteres. `participants` são adicionados logo após a criação
        (resultado em `participantsResult`). Aprovação de entrada: `PUT /groups/{cid}/settings/approval`.
      parameters:
        - { $ref: "#/components/parameters/Sid" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: "Comunidade Astra" }
                subject: { type: string, description: "alias de name" }
                description: { type: string, example: "Avisos e grupos da turma" }
                participants: { type: array, items: { type: string }, example: ["5561999999999"] }
      responses:
        "200":
          description: Comunidade criada (GroupInfo + resultado dos participantes)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/GroupInfo"
                  - type: object
                    properties:
                      participantsResult: { type: array, items: { $ref: "#/components/schemas/CommunityParticipantAdd" }, description: "Só quando participants foi enviado e a adição rodou" }
                      participantsError: { type: string, description: "Erro ao adicionar os participantes (a comunidade foi criada mesmo assim)" }
    get:
      tags: [Comunidades]
      summary: Lista as comunidades em que a conta está
      parameters:
        - { $ref: "#/components/parameters/Sid" }
      responses:
        "200": { $ref: "#/components/responses/GroupList" }

  /api/sessions/{sid}/communities/{cid}:
    get:
      tags: [Comunidades]
      summary: Dados da comunidade + grupos vinculados (campo groups)
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/Cid" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/GroupInfo"
                  - type: object
                    properties:
                      groups: { type: array, items: { $ref: "#/components/schemas/SubGroup" } }
        "400": { description: "O ID não é de uma comunidade" }

  /api/sessions/{sid}/communities/{cid}/groups:
    get:
      tags: [Comunidades]
      summary: Lista os grupos vinculados
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/Cid" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SubGroup" }
    post:
      tags: [Comunidades]
      summary: Cria um grupo novo já dentro da comunidade
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/Cid" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: "Turma 1" }
                subject: { type: string, description: "alias de name" }
                participants: { type: array, items: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Group" }

  /api/sessions/{sid}/communities/{cid}/groups/link:
    post:
      tags: [Comunidades]
      summary: Vincula grupos existentes à comunidade
      description: A conta precisa ser admin da comunidade e dos grupos. Resultado por grupo.
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/Cid" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommunityGroups" }
      responses:
        "200": { $ref: "#/components/responses/CommunityLinkResult" }
        "502": { description: "Nenhum grupo foi vinculado (ver results[].error)" }

  /api/sessions/{sid}/communities/{cid}/groups/unlink:
    post:
      tags: [Comunidades]
      summary: Desvincula grupos da comunidade
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/Cid" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommunityGroups" }
      responses:
        "200": { $ref: "#/components/responses/CommunityLinkResult" }
        "502": { description: "Nenhum grupo foi desvinculado (ver results[].error)" }

  /api/sessions/{sid}/communities/{cid}/participants:
    get:
      tags: [Comunidades]
      summary: Membros de todos os grupos da comunidade
      description: >
        A API do WhatsApp só devolve os JIDs dos membros, então `isAdmin`/`isSuperAdmin`/`admin`
        vêm sempre `false` e `role` sempre `participant` aqui (consulte o grupo para saber os admins).
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/Cid" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GroupParticipant" }

  /api/sessions/{sid}/communities/{cid}/participants/add:
    post:
      tags: [Comunidades]
      summary: Adiciona membros à comunidade
      description: Entram pelo grupo de avisos (como no app). A conta precisa ser admin.
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/Cid" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participants]
              properties:
                participants: { type: array, items: { type: string }, example: ["5561999999999"] }
      responses:
        "200":
          description: Resultado por número
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  participants: { type: array, items: { $ref: "#/components/schemas/CommunityParticipantAdd" } }

  /api/sessions/{sid}/groups/{gid}/status:
    post:
      tags: [Grupos]
      summary: Posta um status do grupo (24 h)
      description: >
        Status do grupo: fica 24 h na aba Atualizações, dentro do grupo, fora da conversa — só os
        membros veem. Texto com cor de fundo OU imagem com legenda (a imagem é enviada de novo a
        cada post).
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/Gid" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string, example: "Promoção só hoje!" }
                backgroundColor: { type: string, example: "#233E4F", description: "#RRGGBB ou #AARRGGBB" }
                textColor: { type: string, example: "#FFFFFF" }
                font: { type: integer, example: 6, description: "fonte do status de texto (número do enum)" }
                imageUrl: { type: string }
                base64: { type: string }
                caption: { type: string }
      responses:
        "200": { description: "Postado: {id, to, timestamp}" }
        "400": { description: "text ou imagem obrigatório / cor inválida" }

  /api/sessions/{sid}/groups/{gid}/leave:
    post:
      tags: [Grupos]
      summary: Sai do grupo
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/Gid" }
      responses:
        "200": { $ref: "#/components/responses/OkTrue" }

  /api/sessions/{sid}/groups/{gid}/participants:
    get:
      tags: [Grupos]
      summary: Lista os participantes
      description: |
        Cada item traz `jid` (de envio, pode ser `@lid`), `phone` (telefone real ou vazio),
        `lid`, `name`/`pushName` e `admin`; `id` é telefone@c.us quando o telefone é conhecido
        (senão o @lid) e `pn` é só o telefone real. Para mencionar alguém no envio, use `phone`
        (ou os dígitos do `lid` quando não há telefone) como `@<dígitos>` no texto.
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/Gid" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GroupParticipant" }

  /api/sessions/{sid}/groups/{gid}/participants/add:
    post:
      tags: [Grupos]
      summary: Adiciona participantes
      description: >
        Opcional `shareHistory`: compartilha as últimas mensagens do grupo com quem foi
        adicionado (recurso "histórico do grupo" do WhatsApp). `true` = 50 mensagens, ou
        um número (até 100). O resultado vem em `history` (ou o erro em `historyError`,
        sem desfazer a adição). Ver `POST .../history/share`.


        Em todas as ações (add/remove/promote/demote) os números são canonicalizados
        (com/sem o 9º dígito BR, como o WhatsApp registrou) antes do envio. A resposta traz
        o resultado por participante: `jid` pode ser `@lid`; `phone` é o telefone real quando
        o WhatsApp informa; `error` (código numérico) só aparece em quem falhou.
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/Gid" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participants]
              properties:
                participants: { type: array, items: { type: string }, example: ["5511999999999"] }
                shareHistory: { oneOf: [{ type: boolean }, { type: integer, minimum: 1, maximum: 100 }], example: 50 }
      responses:
        "200":
          description: Resultado por participante
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  participants: { type: array, items: { $ref: "#/components/schemas/ParticipantChange" } }
                  history: { type: object, description: "Resultado do compartilhamento de histórico (mesmo formato de `result` em POST .../history/share)" }
                  historyError: { type: string, description: "Erro do compartilhamento (a adição NÃO é desfeita)" }

  /api/sessions/{sid}/groups/{gid}/history/share:
    post:
      tags: [Grupos]
      summary: Compartilha o histórico recente do grupo com membros (Group Message History)
      description: >
        Envia as últimas `count` mensagens do grupo (padrão 50, máximo 100) para os
        membros informados, como o "compartilhar histórico" do WhatsApp ao adicionar
        alguém. Os destinatários precisam JÁ ser membros. O pacote vai criptografado só
        para eles, e o grupo todo recebe o aviso de que o histórico foi compartilhado.


        As mensagens saem do banco do AstraCalls: só entra o que esta sessão recebeu ou
        enviou no grupo. Grupo sem mensagens salvas → 400.
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/Gid" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participants]
              properties:
                participants: { type: array, items: { type: string }, example: ["5511999999999"], description: "Telefone, JID ou LID de quem recebe" }
                count: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Histórico enviado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  result:
                    type: object
                    properties:
                      bundleMessageId: { type: string }
                      noticeMessageId: { type: string }
                      messagesCount: { type: integer }
                      historyReceivers: { type: array, items: { type: string } }
                      nonHistoryReceivers: { type: array, items: { type: string } }
                      devices: { type: integer, description: "Aparelhos que receberam o pacote" }
        "400": { description: "Destinatário fora do grupo, própria conta ou sem mensagens salvas" }
        "409":
          description: "WhatsApp recusou o pacote (ex.: 479 — conta sem o flag group_history_send; ver GET .../abprops?code=15313)"
          content:
            application/json:
              schema: { type: object, properties: { error: { type: string }, ack_error: { type: string, example: "479" } } }
        "502": { description: Falha no upload ou envio ao WhatsApp }

  /api/sessions/{sid}/abprops:
    get:
      tags: [Sessões]
      summary: Flags de experimento (AB props) que o WhatsApp liberou para a conta
      description: >
        Diagnóstico: consulta os AB props da conta (`<iq xmlns="abt">`). Ex.: `code=15313`
        é o `group_history_send`, necessário para compartilhar histórico de grupo (sem ele
        o WhatsApp recusa com 479). Sem `code`, devolve o mapa inteiro em `props`.
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { name: code, in: query, required: false, schema: { type: string }, example: "15313", description: "config_code de um flag específico" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer, description: "Quantidade de flags recebidos" }
                  groupHistorySend: { type: boolean, description: "Flag 15313 (group_history_send) ligado" }
                  code: { type: string, description: "Só com ?code=" }
                  value: { type: string, description: "Valor do flag (só com ?code=; \"\" se ausente)" }
                  present: { type: boolean, description: "Só com ?code=: o flag veio na resposta" }
                  props: { type: object, additionalProperties: { type: string }, description: "Sem ?code=: mapa config_code → valor" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { description: Falha na consulta ao WhatsApp }
        "503": { $ref: "#/components/responses/NotPaired" }

  /api/sessions/{sid}/groups/{gid}/participants/remove:
    post:
      tags: [Grupos]
      summary: Remove participantes
      description: "Números canonicalizados (9º dígito). Resultado por participante, como em participants/add."
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/Gid" }
      requestBody: { $ref: "#/components/requestBodies/Participants" }
      responses:
        "200": { $ref: "#/components/responses/ParticipantChangeResult" }

  /api/sessions/{sid}/groups/{gid}/participants/promote:
    post:
      tags: [Grupos]
      summary: Promove participantes a admin
      description: "Números canonicalizados (9º dígito). Resultado por participante, como em participants/add."
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/Gid" }
      requestBody: { $ref: "#/components/requestBodies/Participants" }
      responses:
        "200": { $ref: "#/components/responses/ParticipantChangeResult" }

  /api/sessions/{sid}/groups/{gid}/participants/demote:
    post:
      tags: [Grupos]
      summary: Rebaixa admins a participante
      description: "Números canonicalizados (9º dígito). Resultado por participante, como em participants/add."
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/Gid" }
      requestBody: { $ref: "#/components/requestBodies/Participants" }
      responses:
        "200": { $ref: "#/components/responses/ParticipantChangeResult" }

  /api/sessions/{sid}/groups/{gid}/subject:
    put:
      tags: [Grupos]
      summary: Altera o nome do grupo
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/Gid" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [subject], properties: { subject: { type: string } } }
      responses:
        "200": { $ref: "#/components/responses/OkTrue" }

  /api/sessions/{sid}/groups/{gid}/description:
    put:
      tags: [Grupos]
      summary: Altera a descrição do grupo
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/Gid" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [description], properties: { description: { type: string } } }
      responses:
        "200": { $ref: "#/components/responses/OkTrue" }

  /api/sessions/{sid}/groups/{gid}/picture:
    put:
      tags: [Grupos]
      summary: Define a foto do grupo (base64 ou url)
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/Gid" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { base64: { type: string }, url: { type: string } } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean }, pictureId: { type: string } } }

  /api/sessions/{sid}/groups/{gid}/invite:
    get:
      tags: [Grupos]
      summary: Obtém o link de convite
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/Gid" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { link: { type: string } } }

  /api/sessions/{sid}/groups/{gid}/invite/revoke:
    post:
      tags: [Grupos]
      summary: Revoga o link atual e gera um novo
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/Gid" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { link: { type: string } } }

  /api/sessions/{sid}/groups/{gid}/settings/announce:
    put:
      tags: [Grupos]
      summary: Só admins enviam mensagens (announce)
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/Gid" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { enabled: { type: boolean } } }
      responses:
        "200": { $ref: "#/components/responses/OkTrue" }

  /api/sessions/{sid}/groups/{gid}/settings/locked:
    put:
      tags: [Grupos]
      summary: Só admins editam as infos do grupo (locked)
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/Gid" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { enabled: { type: boolean } } }
      responses:
        "200": { $ref: "#/components/responses/OkTrue" }

  # ===================== Canais =====================
  /api/sessions/{sid}/channels:
    get:
      tags: [Canais]
      summary: Lista os canais que a conta segue
      parameters: [{ $ref: "#/components/parameters/Sid" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Channel" } }

  /api/sessions/{sid}/channels/{id}:
    get:
      tags: [Canais]
      summary: Info de um canal
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ChannelId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }

  /api/sessions/{sid}/channels/{id}/messages:
    get:
      tags: [Canais]
      summary: Mensagens do canal
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ChannelId" }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    serverId: { type: integer }
                    timestamp: { type: integer, format: int64, description: "epoch ms" }
                    views: { type: integer }
                    type: { type: string }

  /api/sessions/{sid}/channels/{id}/follow:
    post:
      tags: [Canais]
      summary: Segue o canal
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ChannelId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean }, following: { type: boolean, example: true } } }

  /api/sessions/{sid}/channels/{id}/unfollow:
    post:
      tags: [Canais]
      summary: Deixa de seguir o canal
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ChannelId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean }, following: { type: boolean, example: false } } }

  /api/sessions/{sid}/channels/{id}/mute:
    post:
      tags: [Canais]
      summary: Silencia o canal
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ChannelId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean }, muted: { type: boolean, example: true } } }

  /api/sessions/{sid}/channels/{id}/unmute:
    post:
      tags: [Canais]
      summary: Remove o silêncio do canal
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ChannelId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean }, muted: { type: boolean, example: false } } }

  # ===================== Presença & Perfil =====================
  /api/sessions/{sid}/presence:
    post:
      tags: [Presença & Perfil]
      summary: Define a presença global (online/offline)
      parameters: [{ $ref: "#/components/parameters/Sid" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { available: { type: boolean, example: true } } }
      responses:
        "200": { $ref: "#/components/responses/OkTrue" }

  /api/sessions/{sid}/presence/{jid}/subscribe:
    post:
      tags: [Presença & Perfil]
      summary: Assina os eventos de presença de um contato
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/Jid" }
      responses:
        "200": { $ref: "#/components/responses/OkTrue" }

  /api/sessions/{sid}/profile:
    get:
      tags: [Presença & Perfil]
      summary: Dados da conta autenticada
      parameters: [{ $ref: "#/components/parameters/Sid" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  jid: { type: string, example: "556192264108:13@s.whatsapp.net", description: "JID do device (inclui o sufixo :N do aparelho)" }
                  number: { type: string, example: "556192264108" }
                  pushName: { type: string }
                  id: { type: string, description: "alias WAHA (número@c.us)" }
                  name: { type: string, description: "alias de pushName" }

  /api/sessions/{sid}/profile/status:
    put:
      tags: [Presença & Perfil]
      summary: Define o recado/About do próprio perfil
      parameters: [{ $ref: "#/components/parameters/Sid" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [status], properties: { status: { type: string, example: "Disponível" } } }
      responses:
        "200": { $ref: "#/components/responses/OkTrue" }

  /api/sessions/{sid}/status/text:
    post:
      tags: [Presença & Perfil]
      summary: Posta um status/story de texto
      parameters: [{ $ref: "#/components/parameters/Sid" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [text], properties: { text: { type: string } } }
      responses:
        "200": { $ref: "#/components/responses/SendOK" }

  /api/sessions/{sid}/status/image:
    post:
      tags: [Presença & Perfil]
      summary: Posta um status/story de imagem
      parameters: [{ $ref: "#/components/parameters/Sid" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                base64: { type: string }
                url: { type: string }
                caption: { type: string }
                mimetype: { type: string, example: "image/jpeg" }
      responses:
        "200": { $ref: "#/components/responses/SendOK" }

  /api/sessions/{sid}/status/video:
    post:
      tags: [Presença & Perfil]
      summary: Posta um status/story de vídeo
      parameters: [{ $ref: "#/components/parameters/Sid" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                base64: { type: string }
                url: { type: string }
                caption: { type: string }
                mimetype: { type: string, example: "video/mp4" }
      responses:
        "200": { $ref: "#/components/responses/SendOK" }

  /api/sessions/{sid}/status/audio:
    post:
      tags: [Presença & Perfil]
      summary: Posta um status/story de áudio
      parameters: [{ $ref: "#/components/parameters/Sid" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                base64: { type: string }
                url: { type: string }
                mimetype: { type: string, example: "audio/ogg; codecs=opus" }
      responses:
        "200": { $ref: "#/components/responses/SendOK" }

  # ===================== Histórico =====================
  /api/sessions/{sid}/chats:
    get:
      tags: [Eventos & Histórico]
      summary: Visão geral das conversas (última mensagem + contagem)
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 1000 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    chat: { type: string }
                    id: { type: string, description: "alias WAHA (número@c.us / @g.us)" }
                    type: { type: string, enum: [individual, group, channel, broadcast] }
                    lastMessage: { type: string }
                    lastType: { type: string }
                    timestamp: { type: integer, format: int64 }
                    count: { type: integer }
                    lastFromMe: { type: boolean }

  /api/sessions/{sid}/chats/{chatId}/messages:
    get:
      tags: [Eventos & Histórico]
      summary: Mensagens de um chat (mais recentes primeiro)
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ChatId" }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: raw, in: query, schema: { type: boolean } }
      responses:
        "200": { $ref: "#/components/responses/MessageList" }

  # ─────────────────────────────────────────────────────────────────
  # Pareamento por código / passkey
  # ─────────────────────────────────────────────────────────────────
  /api/sessions/{sid}/pair-code:
    post:
      tags: [Sessões]
      summary: Inicia o pareamento por CÓDIGO (sem QR)
      description: >
        Vincula o número digitando um código de 8 caracteres no WhatsApp
        (Aparelhos conectados → Conectar aparelho → Conectar com número de telefone).
        Troca o device da sessão; só funciona em conta não pareada. A conexão de fato é
        confirmada depois via SSE `auth-state` (paired:true) em `/api/events`.
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, example: "5561999999999", description: "DDI+DDD+número (só dígitos)" }
      responses:
        "200":
          description: Código gerado
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: "ABCD1234", description: "Código de 8 caracteres p/ digitar no WhatsApp" }
        "400":
          description: "phone obrigatório, sessão inexistente ou conta já pareada"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/sessions/{sid}/pair-passkey:
    post:
      tags: [Sessões]
      summary: Envia a asserção WebAuthn (contas com passkey)
      description: >
        Para contas protegidas por passkey, envia a asserção WebAuthn coletada pela extensão.
        O desafio chega via SSE `auth-state` (state=passkey_request). O body pode ser o
        objeto WebAuthn direto (resultado de `navigator.credentials.get`) ou embrulhado em
        `{"assertion": {...}}`. O sucesso do pareamento chega depois via `auth-state` (state=open).
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assertion: { type: object, description: "Asserção WebAuthn (publicKeyCredential serializado). Opcional: pode mandar o objeto direto no body" }
      responses:
        "200":
          description: Asserção enviada ao WhatsApp
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean, example: true } } }
        "400": { description: "invalid WebAuthn assertion" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ─────────────────────────────────────────────────────────────────
  # Chamadas: toque fantasma, sinalização e controle
  # ─────────────────────────────────────────────────────────────────
  /api/sessions/{sid}/calls/fake:
    post:
      tags: [Chamadas]
      summary: Toque fantasma (faz o número tocar e desliga)
      description: >
        Dispara uma chamada que só faz o destino tocar (offer) e encerra sozinha depois de
        `duration_ms`, sem estabelecer áudio/vídeo.
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, example: "5561999999999" }
                video: { type: boolean, example: false }
                duration_ms: { oneOf: [{ type: integer }, { type: string }], example: 3000, description: "Tempo tocando em ms (padrão 3000, máx. 30000). Aceita número ou string" }
      responses:
        "200":
          description: Chamada fantasma disparada
          content:
            application/json:
              schema:
                type: object
                properties:
                  call: { type: object, properties: { callId: { type: string } } }
                  durationMs: { type: integer, description: "Duração efetivamente aplicada" }
        "400": { description: phone required }
        "503": { description: Conta não pareada }

  /api/sessions/{sid}/calls/{id}/webrtc:
    post:
      tags: [Chamadas]
      summary: Sinalização WebRTC (troca de SDP)
      description: >
        Envia o offer SDP do navegador e recebe o answer. Transporte padrão de áudio
        (UDP direto). Uma única troca offer/answer; sem STUN/TURN nem trickle ICE.
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/CallId" }
        - { $ref: "#/components/parameters/ClientId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sdp_offer]
              properties:
                sdp_offer: { type: string, description: "SDP offer do RTCPeerConnection" }
      responses:
        "200":
          description: SDP answer
          content:
            application/json:
              schema:
                type: object
                properties:
                  sdp_answer: { type: string }
        "404": { description: Chamada inexistente }

  /api/sessions/{sid}/calls/{id}/ws:
    get:
      tags: [Chamadas]
      summary: Áudio da chamada por WebSocket (full-duplex, PCM16) — contrato estável
      description: >
        Upgrade WebSocket (subprotocolo `pcm16`) com o áudio da chamada full-duplex.
        Serve tanto de fallback quando o UDP do WebRTC está bloqueado (Cloudflare, Nginx)
        quanto de via para um consumidor externo (ex.: agente de voz por IA) processar o
        áudio nos dois sentidos.


        **Contrato de fio (estável):**

        - Frames **binários** = áudio **PCM Int16 LE, mono, 16 kHz**, nos dois sentidos.
          Downlink (WhatsApp→cliente) e uplink (cliente→WhatsApp) usam o mesmo formato,
          sem Opus intermediário. Recomendado enviar ~20 ms por frame (320 amostras);
          o servidor aceita qualquer tamanho.

        - Frames de **texto** = eventos de ciclo de vida em JSON, enviados só quando
          conectar com `events=1`: `{"type":"call-status","status":"connected"|...}` e
          `{"type":"call-ended","reason":"..."}`.


        A chamada precisa já existir (crie/atenda antes: `POST .../calls` ou `.../accept`).
        Áudio-only (sem vídeo). Autentique com `?apiKey=`.


        ⚠️ Fechar o WebSocket ENCERRA a chamada no WhatsApp.
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/CallId" }
        - name: events
          in: query
          required: false
          schema: { type: string, enum: ["1", "true"] }
          description: "Se presente, envia eventos de ciclo de vida da chamada como frames de texto JSON (além do áudio binário)."
      responses:
        "101": { description: Conexão WebSocket estabelecida }
        "404": { description: Chamada inexistente }

  /api/sessions/{sid}/calls/{id}/spy:
    post:
      tags: [Chamadas]
      summary: Espiar a chamada por WebRTC (escuta em tempo real, só ouvir)
      description: >
        Abre uma conexão WebRTC à chamada como se fosse a ligação, mas **somente para
        ouvir**: o cliente recebe o mix dos dois lados (interlocutor do WhatsApp +
        atendente), em Opus. Nada do que o espião envia entra na chamada e a presença
        dele não altera a sinalização com o WhatsApp — a ligação segue normal para as
        duas pontas. Vários espiões por chamada são permitidos; a chamada NÃO é
        reivindicada (owner) nem a ponte do atendente é fechada. Só áudio.


        O cliente monta um `RTCPeerConnection` com um transceiver de áudio
        `recvonly`, manda o offer aqui e aplica o answer. Quando alguém começa/para de
        espiar, o SSE recebe `{"type":"call-action","kind":"spy","state":true|false,"count":N}`
        (a UI do atendente pode mostrar "supervisor ouvindo").
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/CallId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sdp_offer]
              properties:
                sdp_offer: { type: string, description: "SDP offer do RTCPeerConnection (áudio recvonly)" }
      responses:
        "200":
          description: SDP answer + id do espião
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  spy_id: { type: string, description: "Use em DELETE .../spy/{spyId} para parar de ouvir" }
                  sdp_answer: { type: string }
        "404": { description: Chamada inexistente }
    get:
      tags: [Chamadas]
      summary: Lista quem está espiando a chamada
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/CallId" }
      responses:
        "200":
          description: Espiões ativos
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  spies: { type: array, items: { type: string } }
        "404": { description: Chamada inexistente }

  /api/sessions/{sid}/calls/{id}/spy/ws:
    get:
      tags: [Chamadas]
      summary: Espiar a chamada por WebSocket (PCM16, só downlink)
      description: >
        Mesma escuta do `POST .../spy`, mas por WebSocket (subprotocolo `pcm16`): frames
        **binários** PCM Int16 LE, mono, 16 kHz com o mix dos dois lados. Frames enviados
        pelo cliente são ignorados. Útil atrás de proxy sem UDP e para serviços externos
        (gravação/IA) ouvirem a chamada em tempo real. Autentique com `?apiKey=`.
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/CallId" }
      responses:
        "101": { description: Conexão WebSocket estabelecida }
        "404": { description: Chamada inexistente }

  /api/sessions/{sid}/calls/{id}/spy/{spyId}:
    delete:
      tags: [Chamadas]
      summary: Para de espiar (fecha a conexão do espião)
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/CallId" }
        - { name: spyId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Espião removido }
        "404": { description: Chamada ou espião inexistente }

  /api/sessions/{sid}/calls/{id}/volume:
    post:
      tags: [Chamadas]
      summary: Ajusta o volume da chamada (ganho do interlocutor → atendente)
      description: >
        Aplica um ganho **no servidor** ao áudio que vem do WhatsApp antes de sair para o
        consumidor (WebRTC, WebSocket ou SIP). `level` 1 = normal, 0 = mudo (a chamada
        continua), até 3 = triplo (com clamp, para interlocutor baixo). Vale para qualquer
        cliente da chamada sem código no front; a gravação e os espiões recebem o áudio
        original. O valor aplicado é replicado por SSE:
        `{"type":"call-volume","id":"<callId>","level":1.5}`.
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/CallId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                level: { oneOf: [{ type: number }, { type: string }], example: 1.5, description: "Ganho 0..3 (1 = normal). Aceita número ou string; fora da faixa sofre clamp. Alternativa: percent" }
                percent: { oneOf: [{ type: number }, { type: string }], example: 150, description: "0..300 (= level×100). Aceita número ou string" }
      responses:
        "200":
          description: Volume aplicado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  level: { type: number, example: 1.5, description: "Valor efetivamente aplicado (após clamp)" }
        "400": { description: level/percent ausente }
        "404": { description: Chamada inexistente }
    get:
      tags: [Chamadas]
      summary: Volume atual da chamada
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/CallId" }
      responses:
        "200":
          description: Ganho atual
          content:
            application/json:
              schema:
                type: object
                properties:
                  level: { type: number, example: 1 }
        "404": { description: Chamada inexistente }

  /api/sessions/{sid}/calls/{id}/silence:
    post:
      tags: [Chamadas]
      summary: Silencia o toque da chamada recebida só na tela (o celular continua tocando)
      description: >
        Marca a chamada que está tocando como **silenciada na tela**. NÃO fala com o
        WhatsApp: a chamada continua tocando no celular e nos outros devices, e o pop-up
        continua aberto para atender ou recusar. O servidor replica por SSE
        `{"type":"call-action","kind":"silence","state":true|false}` para todos os
        widgets/painéis da conta pararem (ou voltarem) o toque. Sem body = silenciar.
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/CallId" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                silenced: { type: boolean, default: true }
      responses:
        "200":
          description: Estado aplicado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  silenced: { type: boolean }
        "404": { description: Chamada inexistente }

  /api/sessions/{sid}/calls/{id}/hold:
    post:
      tags: [Chamadas]
      summary: Coloca a chamada em espera (hold)
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/CallId" }
        - { $ref: "#/components/parameters/ClientId" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                moh: { type: boolean, default: true, description: "Tocar música de espera para o interlocutor" }
      responses:
        "200":
          description: Em espera
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  held: { type: boolean, example: true }
                  moh: { type: boolean }
        "404": { description: "no such call" }
        "409": { description: Estado da chamada não permite espera }

  /api/sessions/{sid}/calls/{id}/resume:
    post:
      tags: [Chamadas]
      summary: Tira a chamada da espera (resume)
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/CallId" }
        - { $ref: "#/components/parameters/ClientId" }
      responses:
        "200":
          description: Retomada
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  held: { type: boolean, example: false }
        "404": { description: "no such call" }
        "409": { description: Chamada não está em espera / estado inválido }

  /api/sessions/{sid}/calls/{id}/transfer:
    post:
      tags: [Chamadas]
      summary: Transferência cega para outro atendente
      description: >
        Passa a chamada para outro atendente (troca de dono + ponte), sem tocar o leg do
        WhatsApp. Com `to` = clientId do atendente alvo; sem ele, a oferta vai para todos.
        Também vale para a chamada SIP do modo agente (`sip-…`): ela vai para a espera com
        música (`moh:false` = silêncio), a ponte WS da IA recebe `{"type":"call-transferred"}`
        e é fechada SEM derrubar a ligação, o dono é liberado e sai `call-transfer-offer`.
        O atendente assume com `.../pickup` e conecta o áudio com `.../webrtc` ou `.../ws`,
        o que tira a chamada da espera.
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/CallId" }
        - { $ref: "#/components/parameters/ClientId" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                to: { type: string, description: "clientId do atendente alvo (opcional = fila)" }
                moh: { type: boolean, description: "música de espera durante a transferência (padrão true)" }
      responses:
        "200":
          description: Transferida
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  transferred: { type: boolean, example: true }
                  to: { type: string }
        "404": { description: "no such call" }

  /api/sessions/{sid}/calls/{id}/pickup:
    post:
      tags: [Chamadas]
      summary: Assume uma chamada transferida
      description: >
        Fixa o novo dono (`X-Client-Id`) de uma chamada transferida (não re-atende no
        WhatsApp). Depois o navegador chama `.../webrtc` (abre a ponte) e `.../resume`.
        Na chamada SIP do modo agente, conectar `.../webrtc` ou `.../ws` já tira da espera.
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/CallId" }
        - { $ref: "#/components/parameters/ClientId" }
      responses:
        "200":
          description: Assumida
          content:
            application/json:
              schema:
                type: object
                properties:
                  call: { type: object, properties: { callId: { type: string } } }
        "404": { description: "no such call" }

  # ─────────────────────────────────────────────────────────────────
  # Envios especiais
  # ─────────────────────────────────────────────────────────────────
  /api/sessions/{sid}/messages/sticker:
    post:
      tags: [Mensagens]
      summary: Envia um sticker (figurinha)
      description: "A figurinha precisa ser WebP pronto (512x512); não há conversão. Não suporta citação/menção."
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              description: "Envie a figurinha por **base64** OU por **url**."
              properties:
                to: { type: string, example: "5561999999999" }
                base64: { type: string }
                url: { type: string }
                mimetype: { type: string, default: "image/webp" }
                animated: { type: boolean, default: false, description: "true = figurinha animada" }
      responses:
        "200": { $ref: "#/components/responses/SendOK" }

  /api/sessions/{sid}/messages/pix:
    post:
      tags: [Mensagens]
      summary: Envia cobrança Pix (Copia e Cola / BR Code)
      description: >
        Padrão: monta o "Pix Copia e Cola" (BR Code EMV do Banco Central) e envia como TEXTO.
        Informe `key` (gera o código) OU `code` (BR Code pronto). Se houver `description`,
        ela vai numa mensagem antes do código.

        Com `style: "charge"`: envia o CARTÃO DE COBRANÇA nativo do WhatsApp Business (o
        mesmo do "Cobrar" do app) — referência (`txid`), itens, total em R$ e botão Pagar
        que abre o fluxo de pagamento. Exige `key` e `amount` (ou `items`, cuja soma vira o
        total). `description` vira o texto do cartão e `footer` o rodapé. Requer conta
        WhatsApp Business. Neste modo a rota aceita `X-Message-ID`.
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { type: string, example: "5561999999999" }
                key: { type: string, example: "raphael@email.com", description: "Chave Pix (obrigatória se não enviar code)" }
                amount: { type: number, example: 49.90, description: "Valor; ≤0/ausente = sem valor. Aceita número ou string" }
                merchantName: { type: string, example: "Astra Online", description: "máx 25, vira ASCII maiúsculo" }
                merchantCity: { type: string, example: "Sao Paulo", description: "máx 15" }
                txid: { type: string, example: "PEDIDO123", description: "máx 25" }
                description: { type: string, example: "Cobrança do plano" }
                code: { type: string, description: "BR Code pronto (ignora key/amount/etc.)" }
                style: { type: string, enum: [text, charge], description: "charge = cartão de cobrança nativo" }
                keyType: { type: string, enum: [CPF, CNPJ, EMAIL, PHONE, EVP], description: "tipo da chave (charge); deduzido se ausente" }
                footer: { type: string, description: "rodapé do cartão (charge)" }
                items:
                  type: array
                  description: "itens da cobrança (charge); sem itens vira um item 'Cobrança' com o amount"
                  items:
                    type: object
                    properties:
                      name: { type: string, example: "Camisa" }
                      amount: { type: number, example: 49.9, description: "valor unitário em reais" }
                      quantity: { type: integer, example: 2 }
      responses:
        "200":
          description: Pix enviado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, description: "ID da mensagem do código" }
                  ids: { type: array, items: { type: string }, description: "IDs das mensagens (descrição + código)" }
                  to: { type: string }
                  code: { type: string, description: "O BR Code enviado" }
        "400": { description: "key ou code obrigatório" }

  /api/sessions/{sid}/messages/product:
    post:
      tags: [Mensagens]
      summary: Envia um produto (imagem + legenda formatada)
      description: >
        Card de produto simulado: foto (opcional) + legenda com título, preço e link.
        Sem foto, vira texto com preview de link. Funciona em qualquer conta (não exige Business).
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, title]
              properties:
                to: { type: string, example: "5561999999999" }
                title: { type: string, example: "Camiseta Astra" }
                description: { type: string }
                price: { type: number, example: 79.90, description: "Aceita número ou string" }
                salePrice: { type: number, description: "Preço promocional (opcional)" }
                currency: { type: string, example: "R$" }
                url: { type: string, description: "Link do produto" }
                productId: { type: string }
                footer: { type: string }
                image: { type: string, description: "Foto em base64 (opcional)" }
                imageUrl: { type: string, description: "Ou por URL (opcional)" }
                mimetype: { type: string, example: "image/jpeg" }
      responses:
        "200": { $ref: "#/components/responses/SendOK" }
        "400": { description: "title obrigatório" }

  /api/sessions/{sid}/messages/product-native:
    post:
      tags: [Mensagens]
      summary: Envia produto NATIVO (catálogo do WhatsApp Business)
      description: >
        Mensagem de produto nativa via catálogo. Exige conta WhatsApp Business e um produto
        no catálogo (productId/businessJid).
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, productId]
              properties:
                to: { type: string }
                productId: { type: string, description: "ID do produto no catálogo (obrigatório)" }
                businessJid: { type: string, description: "Dono do catálogo (padrão = a própria conta)" }
                title: { type: string }
                description: { type: string }
                price: { type: number, description: "Aceita número ou string" }
                salePrice: { type: number }
                currency: { type: string, example: "BRL" }
                retailerId: { type: string }
                url: { type: string }
                image: { type: string, description: "base64" }
                imageUrl: { type: string }
                mimetype: { type: string }
      responses:
        "200": { $ref: "#/components/responses/SendOK" }
        "400": { description: "productId required" }

  # ─────────────────────────────────────────────────────────────────
  # Grupos: solicitações de entrada e configurações
  # ─────────────────────────────────────────────────────────────────
  /api/sessions/{sid}/groups/{gid}/requests:
    get:
      tags: [Grupos]
      summary: Lista solicitações de entrada pendentes
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/Gid" }
        - { $ref: "#/components/parameters/ClientId" }
      responses:
        "200":
          description: Solicitações
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items:
                      type: object
                      properties:
                        jid: { type: string, description: "Pode ser @lid" }
                        requestedAt: { type: integer, format: int64, description: "epoch em SEGUNDOS" }

  /api/sessions/{sid}/groups/{gid}/requests/approve:
    post:
      tags: [Grupos]
      summary: Aprova solicitações de entrada
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/Gid" }
        - { $ref: "#/components/parameters/ClientId" }
      requestBody: { $ref: "#/components/requestBodies/Participants" }
      responses:
        "200":
          description: Aprovadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  participants:
                    type: array
                    items:
                      type: object
                      properties:
                        jid: { type: string, description: "Pode ser @lid" }
                        phone: { type: string, description: "Telefone real quando conhecido; senão \"\"" }
                        error: { type: integer, description: "Código do WhatsApp (0 = ok)" }

  /api/sessions/{sid}/groups/{gid}/requests/reject:
    post:
      tags: [Grupos]
      summary: Rejeita solicitações de entrada
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/Gid" }
        - { $ref: "#/components/parameters/ClientId" }
      requestBody: { $ref: "#/components/requestBodies/Participants" }
      responses:
        "200":
          description: Rejeitadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  participants:
                    type: array
                    items:
                      type: object
                      properties:
                        jid: { type: string, description: "Pode ser @lid" }
                        phone: { type: string, description: "Telefone real quando conhecido; senão \"\"" }
                        error: { type: integer, description: "Código do WhatsApp (0 = ok)" }

  /api/sessions/{sid}/groups/{gid}/settings/approval:
    put:
      tags: [Grupos]
      summary: Liga/desliga aprovação de novos membros
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/Gid" }
        - { $ref: "#/components/parameters/ClientId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean, description: "true = novos membros precisam de aprovação de admin" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  enabled: { type: boolean }

  /api/sessions/{sid}/groups/{gid}/settings/add-mode:
    put:
      tags: [Grupos]
      summary: Define quem pode adicionar membros
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/Gid" }
        - { $ref: "#/components/parameters/ClientId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [admin_add, all_member_add], description: "quem pode adicionar participantes" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  mode: { type: string }

  # ─────────────────────────────────────────────────────────────────
  # Perfil, privacidade e mensagens temporárias
  # ─────────────────────────────────────────────────────────────────
  /api/sessions/{sid}/profile/qr:
    get:
      tags: [Presença & Perfil]
      summary: Link/QR do próprio contato
      description: Retorna o link de contato do próprio número. `?revoke=true` gera um novo.
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { name: revoke, in: query, schema: { type: boolean }, description: "true = revoga o link atual e gera outro" }
        - { $ref: "#/components/parameters/ClientId" }
      responses:
        "200":
          description: Link do contato
          content:
            application/json:
              schema:
                type: object
                properties:
                  link: { type: string, example: "https://wa.me/qr/XXXXXXXX" }
                  code: { type: string, example: "XXXXXXXX", description: "Só o código do link" }

  /api/sessions/{sid}/privacy:
    get:
      tags: [Presença & Perfil]
      summary: Configurações de privacidade da conta
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      responses:
        "200":
          description: Privacidade
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivacySettings" }
    put:
      tags: [Presença & Perfil]
      summary: Altera uma configuração de privacidade
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, value]
              properties:
                name: { type: string, enum: [groupadd, last, status, profile, readreceipts, online, calladd, messages, defense, stickers] }
                value:
                  type: string
                  enum: [all, contacts, contact_allowlist, contact_blacklist, none, known, match_last_seen, on_standard, off]
                  description: >-
                    Valores válidos por name: groupadd/last/status/profile = all|contacts|contact_blacklist|none;
                    readreceipts = all|none; online = all|match_last_seen; calladd = all|known;
                    messages = all|contacts; defense = on_standard|off; stickers = contacts|contact_allowlist|none.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  settings: { $ref: "#/components/schemas/PrivacySettings" }
        "400": { description: "name and value required" }

  /api/sessions/{sid}/privacy/status:
    get:
      tags: [Presença & Perfil]
      summary: Quem pode ver o seu status/stories
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      responses:
        "200":
          description: Privacidade do status
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusPrivacy:
                    type: array
                    items:
                      type: object
                      properties:
                        type: { type: string, enum: [contacts, blacklist, whitelist], description: "contacts = todos os contatos; blacklist = contatos exceto list; whitelist = só os da list" }
                        list: { type: array, items: { type: string }, description: "JIDs da lista" }
                        isDefault: { type: boolean, description: "true = a opção ativa" }

  /api/sessions/{sid}/disappearing:
    put:
      tags: [Presença & Perfil]
      summary: Mensagens temporárias PADRÃO (novas conversas)
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                seconds: { type: integer, enum: [0, 86400, 604800, 7776000], description: "0=desliga, 86400=24h, 604800=7d, 7776000=90d" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  seconds: { type: integer }

  /api/sessions/{sid}/chats/{chatId}/disappearing:
    put:
      tags: [Presença & Perfil]
      summary: Mensagens temporárias de UMA conversa
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ChatId" }
        - { $ref: "#/components/parameters/ClientId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                seconds: { type: integer, description: "0=desliga. Ex.: 86400, 604800, 7776000" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  chat: { type: string }
                  seconds: { type: integer }

  # ─────────────────────────────────────────────────────────────────
  # Contatos: perfil Business
  # ─────────────────────────────────────────────────────────────────
  /api/sessions/{sid}/contacts/{jid}/business:
    get:
      tags: [Contatos]
      summary: Perfil comercial (Business) de um contato
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/Jid" }
        - { $ref: "#/components/parameters/ClientId" }
      responses:
        "200":
          description: Perfil Business (campos conforme disponível)
          content:
            application/json:
              schema:
                type: object
                properties:
                  jid: { type: string }
                  address: { type: string }
                  email: { type: string }
                  categories:
                    type: array
                    items: { type: object, properties: { id: { type: string }, name: { type: string } } }
                  timezone: { type: string, example: "America/Sao_Paulo" }
                  businessHours: { type: array, items: { type: object }, description: "Horários por dia da semana (como o WhatsApp informa)" }
        "404": { description: "not a business account" }

  # ─────────────────────────────────────────────────────────────────
  # Chatwoot
  # ─────────────────────────────────────────────────────────────────
  /api/chatwoot/resolve:
    get:
      tags: [Chatwoot]
      summary: Resolve a sessão a partir de uma conversa do Chatwoot
      description: >
        Mapeia account_id/conversation_id do Chatwoot para a sessão (a da inbox da conversa)
        e o telefone do contato (LID convertido para telefone). Em conversa de GRUPO devolve
        `group: true`, o `group_jid` e se a chamada em grupo está ligada (`phone` vazio).
        Liberada para a chave/token de widget.
      parameters:
        - { name: account_id, in: query, required: true, schema: { type: integer } }
        - { name: conversation_id, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Dados resolvidos
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: { type: string }
                  inbox_id: { type: integer }
                  phone: { type: string, example: "5561999999999", description: "\"\" em conversa de grupo" }
                  name: { type: string }
                  group: { type: boolean, description: "Só em conversa de grupo" }
                  group_jid: { type: string, description: "Só em conversa de grupo" }
                  group_calls: { type: boolean, description: "Só em conversa de grupo: chamada em grupo habilitada" }
        "400": { description: "account_id and conversation_id required" }
        "404": { description: "Nenhuma sessão ligada à conta/inbox, ou contato sem telefone" }
        "502": { description: "chatwoot lookup failed" }

  # ─────────────────────────────────────────────────────────────────
  # Mensagens — extras (idempotência, PTV, encaminhar, busca)
  # ─────────────────────────────────────────────────────────────────
  /api/sessions/{sid}/messages/new-message-id:
    get:
      tags: [Mensagens]
      summary: Gera um id de mensagem (para envio idempotente)
      description: >-
        Devolve um id pré-gerado. Use no envio (header `X-Message-ID` ou `?id=`) para
        idempotência: reenviar com o mesmo id NÃO duplica a mensagem no WhatsApp.
      parameters:
        - { $ref: "#/components/parameters/Sid" }
      responses:
        "200":
          description: id gerado
          content:
            application/json:
              schema: { type: object, properties: { id: { type: string } } }

  /api/sessions/{sid}/messages/ptv:
    post:
      tags: [Mensagens]
      summary: Envia uma nota de vídeo (PTV, vídeo redondo)
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { type: string, example: "5561999999999" }
                base64: { type: string, description: "Vídeo em base64 (ou use url)" }
                url: { type: string, description: "URL do vídeo (o servidor baixa)" }
                mimetype: { type: string, example: "video/mp4" }
                quotedMessageId: { type: string, description: "Cita (responde) a mensagem com esse id" }
                participant: { type: string, description: "Em grupo: JID de quem enviou a citada" }
                fromMe: { type: boolean, description: "true se a citada é sua" }
      responses:
        "200": { $ref: "#/components/responses/SendOK" }
        "503": { description: Conta não pareada }

  /api/sessions/{sid}/messages/forward:
    post:
      tags: [Mensagens]
      summary: Encaminha uma mensagem existente do histórico
      description: Reconstrói a mensagem pelo id (inclusive mídia) e reenvia marcada como encaminhada.
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, messageId]
              properties:
                to: { type: string, example: "5561999999999" }
                messageId: { type: string, description: "id da mensagem a encaminhar (do histórico)" }
      responses:
        "200": { $ref: "#/components/responses/SendOK" }
        "404": { description: Mensagem não encontrada no histórico }

  /api/sessions/{sid}/messages/search:
    get:
      tags: [Mensagens]
      summary: Busca no histórico de mensagens (texto)
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { name: q, in: query, required: true, schema: { type: string }, description: "Texto a buscar (ILIKE)" }
        - { name: chatId, in: query, required: false, schema: { type: string }, description: "Limita a um chat" }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50, maximum: 1000 } }
      responses:
        "200": { $ref: "#/components/responses/MessageList" }
        "400": { description: "q required / chatId inválido" }

  # ─────────────────────────────────────────────────────────────────
  # Interativas (native flow) — botões, lista, carrossel
  # ─────────────────────────────────────────────────────────────────
  /api/sessions/{sid}/messages/buttons:
    post:
      tags: [Interativas]
      summary: Botões de resposta (reply, até 3)
      description: >
        Renderiza no app do WhatsApp e no Web. Em GRUPO, tocar num botão de
        resposta postaria a escolha pro grupo inteiro (todos notificados =
        "marca geral"); por isso, quando o destino é um grupo, o backend
        converte automaticamente os botões de resposta em botões cta_url wa.me
        (abrem o PV com o texto pronto, sem postar no grupo). O mesmo vale para
        quick_reply em /messages/interactive e /messages/carousel.
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, buttons]
              properties:
                to: { type: string, example: "5561999999999" }
                text: { type: string, example: "Escolha:" }
                footer: { type: string }
                buttons:
                  type: array
                  items: { type: object, properties: { id: { type: string }, text: { type: string } } }
                  example: [{ id: "sim", text: "Sim" }, { id: "nao", text: "Não" }]
      responses:
        "200": { $ref: "#/components/responses/SendOK" }

  /api/sessions/{sid}/messages/interactive:
    post:
      tags: [Interativas]
      summary: Botões de ação (CTA — URL, copiar, ligar, quick reply)
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, buttons]
              properties:
                to: { type: string, example: "5561999999999" }
                body: { type: string, example: "Fale com a gente:" }
                footer: { type: string }
                buttons:
                  type: array
                  items:
                    type: object
                    properties:
                      type: { type: string, enum: [quick_reply, cta_url, cta_copy, cta_call, webview, form, cta_catalog], description: "webview e form são sinônimos (cta_url aberto em webview tela cheia); cta_catalog abre o produto `id` no catálogo (sem id, o catálogo inteiro)" }
                      displayText: { type: string }
                      url: { type: string, description: "para cta_url / webview (webview abre em tela cheia dentro do WhatsApp)" }
                      id: { type: string, description: "para quick_reply" }
                      copyCode: { type: string, description: "para cta_copy" }
                      phoneNumber: { type: string, description: "para cta_call" }
                  example:
                    - { type: cta_url, displayText: "Abrir site", url: "https://astraonline.com.br" }
                    - { type: cta_copy, displayText: "Copiar cupom", copyCode: "ASTRA10" }
      responses:
        "200": { $ref: "#/components/responses/SendOK" }

  /api/sessions/{sid}/messages/list:
    post:
      tags: [Interativas]
      summary: Menu de lista (single select)
      description: "Renderiza no app do celular; no WhatsApp Web pede para usar o celular (limitação do Web)."
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, sections]
              properties:
                to: { type: string, example: "5561999999999" }
                body: { type: string }
                text: { type: string, description: "alias de body (usado se body vier vazio)" }
                footer: { type: string }
                buttonText: { type: string, example: "Abrir menu", default: "Ver opções" }
                sections:
                  type: array
                  items:
                    type: object
                    properties:
                      title: { type: string }
                      rows:
                        type: array
                        items: { type: object, properties: { id: { type: string }, title: { type: string }, description: { type: string } } }
      responses:
        "200": { $ref: "#/components/responses/SendOK" }

  /api/sessions/{sid}/messages/catalog:
    post:
      tags: [Mensagens]
      summary: Mensagem de catálogo (abre a vitrine)
      description: >
        Botão nativo "Ver catálogo" que abre a vitrine inteira da empresa dentro do WhatsApp
        (celular e Web). `productId` usa esse produto como miniatura. Requer conta Business com
        catálogo. Para produtos lado a lado use /messages/carousel com botões
        `{"type":"cta_catalog","id":"<produto>"}` (o card ganha um link "Ver catálogo" se não
        tiver nenhum, senão o celular descarta).
      parameters:
        - { $ref: "#/components/parameters/Sid" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { type: string, example: "5561999999999" }
                body: { type: string, example: "Confira nosso catálogo 👇" }
                footer: { type: string }
                productId: { type: string, description: "retailer id do produto da miniatura" }
      responses:
        "200": { description: "Enviada: {id, to, timestamp}" }

  /api/sessions/{sid}/meta-ai:
    post:
      tags: [Mensagens]
      summary: Pergunta à Meta AI pela conta conectada
      description: >
        Manda a pergunta (texto ou imagem) para a Meta AI como o próprio app e devolve a
        resposta completa. `thread` mantém o contexto por 30 min (ex.: o número do cliente).
        `instructions` vai antes da 1ª pergunta de cada conversa. `replyTo` manda "Pensando…" no
        chat e edita com a resposta; `label` marca com o selo IA (só conta Business, só conversa
        privada). ATENÇÃO: a memória da Meta AI é da conta, não da conversa — o que um cliente
        disser pode aparecer para outro; não use com dado pessoal.
      parameters:
        - { $ref: "#/components/parameters/Sid" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt: { type: string, example: "Resuma em 2 linhas: ..." }
                imageUrl: { type: string }
                base64: { type: string }
                thread: { type: string, example: "5561999999999" }
                instructions: { type: string, example: "Responda em português, curto." }
                timeoutSeconds: { type: integer, example: 35 }
                replyTo: { type: string, example: "5561999999999" }
                label: { type: boolean }
      responses:
        "200":
          description: Resposta
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer: { type: string }
                  complete: { type: boolean }
                  chunks: { type: integer }
                  thread: { type: string }
                  threadNew: { type: boolean }
                  promptId: { type: string }
                  messageId: { type: string, description: "mensagem editada no replyTo" }
                  ms: { type: integer }
        "504": { description: "A Meta AI não respondeu a tempo (answer pode vir parcial)" }

  /api/sessions/{sid}/messages/carousel:
    post:
      tags: [Interativas]
      summary: Carrossel de cards (imagem + texto + botões)
      description: "Até ~10 cards, cada um com imagem, título, texto e botões (CTA/quick reply)."
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, cards]
              properties:
                to: { type: string, example: "5561999999999" }
                body: { type: string, example: "🎠 Nossos planos" }
                cards:
                  type: array
                  items:
                    type: object
                    description: "Cada card exige imagem: `imageUrl` OU `base64`."
                    properties:
                      imageUrl: { type: string, description: "URL da imagem do card (ou base64)" }
                      base64: { type: string }
                      title: { type: string }
                      body: { type: string }
                      buttons:
                        type: array
                        items:
                          type: object
                          properties:
                            type: { type: string, enum: [quick_reply, cta_url, cta_copy, cta_call, webview, form, cta_catalog], description: "cta_catalog = produto `id` no catálogo; card sem link ganha \"Ver catálogo\"" }
                            displayText: { type: string }
                            url: { type: string }
                            id: { type: string }
                            copyCode: { type: string }
                            phoneNumber: { type: string }
      responses:
        "200": { $ref: "#/components/responses/SendOK" }

  /api/sessions/{sid}/native-forms:
    get:
      tags: [Mensagens]
      summary: Lista os formulários nativos da conta (app WhatsApp Business)
      description: >
        Formulários nativos que a conta já enviou, pelo celular ou pela API, com o modelo
        pronto para reenviar via `POST .../messages/native-form` (flowId, body, cta, screen,
        data) e a contagem de envios e respostas. O WhatsApp não entrega a aparelhos
        vinculados a lista de formulários criados no app: um formulário novo aparece aqui
        depois do primeiro envio pelo celular.
      parameters:
        - { $ref: "#/components/parameters/Sid" }
      responses:
        "200":
          description: Formulários
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  hint: { type: string, description: "Lembrete de que a lista vem dos formulários já enviados" }
                  forms:
                    type: array
                    items:
                      type: object
                      properties:
                        flowId: { type: string }
                        flowName: { type: string }
                        formType: { type: string }
                        body: { type: string }
                        cta: { type: string }
                        screen: { type: string }
                        data: { type: object }
                        fields: { type: array, items: { type: string } }
                        sentCount: { type: integer }
                        lastSentAt: { type: integer }
                        responseCount: { type: integer }
                        lastResponseAt: { type: integer }
        "503": { description: "banco de mensagens desligado" }

  /api/sessions/{sid}/messages/native-form:
    post:
      tags: [Mensagens]
      summary: Envia um formulário NATIVO criado no app WhatsApp Business (Formulários)
      description: >
        Envia o formulário nativo que a PRÓPRIA conta criou no app WhatsApp Business
        (Ferramentas comerciais → Formulários). Abre dentro do WhatsApp do cliente, igual ao
        envio pelo celular. O `flowId` é o do formulário da conta: envie o formulário uma vez
        pelo celular e pegue o `flow_id` no conteúdo da mensagem (GET .../chats/{chat}/messages?raw=true).
        Só funciona com formulário da conta que envia. Para número comum (não Business), use
        `POST .../messages/form` (formulário em página).


        O que dá para controlar pela API: o texto da mensagem (`body`), o texto do botão
        (`cta`) e, nos modelos (`formType: template`), quais campos aparecem via `data`
        (ex.: `{"full_name_visible":true,"email_visible":true,"phone_number_visible":false}`).
        As PERGUNTAS não: são as salvas na criação do formulário no app (num formulário gerado
        por IA, `data.custom_fields` diferentes são ignorados). Para perguntas livres, use
        `POST .../messages/form`. Os formulários da conta saem de `GET .../native-forms`.


        A resposta do cliente chega como mensagem (texto "📋 Formulário respondido" com os
        campos, também no Chatwoot) e no webhook `form_response` com `source:"native"`,
        `flowId`, `flowName`, `flowToken` (o devolvido aqui no envio), `answers`
        (`{nome_do_campo: valor}`) e `fields` (tela, tipo, nome, rótulo, valor).
      parameters:
        - { $ref: "#/components/parameters/Sid" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, flowId]
              properties:
                to: { type: string, example: "5561999999999" }
                flowId: { type: string, example: "1615193897066865" }
                body: { type: string, default: "Compartilhe seus dados." }
                cta: { type: string, default: "Preencher formulário" }
                screen: { type: string, example: contact_details, description: "Tela inicial do formulário" }
                data: { type: object, example: { full_name_visible: true, email_visible: true, phone_number_visible: true } }
                formType: { type: string, default: template }
                flowToken: { type: string, description: "Opcional; gerado (UUID) se ausente" }
                biz: { type: string, enum: [mixed, none, galaxy], default: mixed, description: "Nó <biz> do envio; galaxy é recusado (405) vindo de aparelho vinculado" }
      responses:
        "200":
          description: Enviado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  to: { type: string }
                  flowToken: { type: string }
                  timestamp: { type: integer, description: "epoch ms" }
        "400": { description: "to e flowId obrigatórios / destino é grupo (formulário nativo só em conversa individual)" }

  /api/sessions/{sid}/messages/form:
    post:
      tags: [Interativas]
      summary: Formulário (webview) — abre uma página de form DENTRO do WhatsApp
      description: >
        Envia uma mensagem interativa com um botão que abre uma WEBVIEW em tela
        cheia dentro do próprio WhatsApp (não é o navegador externo), renderizando
        um formulário com os campos informados. Ao enviar, as respostas: (1) caem
        no Chatwoot como mensagem recebida do cliente, (2) disparam o webhook
        `form_response` com os dados estruturados. Alternativa ao WhatsApp Flows
        nativo (que exige conta oficial/WABA e NÃO funciona em número não-oficial).
        As rotas `GET /forms/{token}` e `POST /forms/{token}/submit` são públicas
        (o token assinado é a capability) e não exigem API key.
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { $ref: "#/components/parameters/ClientId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, fields]
              properties:
                to: { type: string, example: "5561999999999" }
                title: { type: string, example: "Cadastro rápido" }
                body: { type: string, example: "Preencha seus dados 👇" }
                footer: { type: string, example: "AstraCalls" }
                buttonText: { type: string, example: "Abrir formulário", description: "Texto do botão que abre a webview" }
                submitText: { type: string, example: "Enviar cadastro", description: "Texto do botão de envio dentro do form" }
                fields:
                  type: array
                  description: "Campos do formulário, na ordem em que aparecem."
                  items:
                    type: object
                    required: [name]
                    properties:
                      name: { type: string, example: "email", description: "Chave do campo (vem no webhook)" }
                      label: { type: string, example: "E-mail" }
                      type:
                        type: string
                        enum: [text, email, tel, number, date, textarea, select]
                        default: text
                      options:
                        type: array
                        items: { type: string }
                        description: "Opções (apenas para type=select)"
                      placeholder: { type: string }
                      required: { type: boolean, default: false }
      responses:
        "200": { $ref: "#/components/responses/SendOK" }

  /forms/{token}:
    get:
      tags: [Interativas]
      summary: "Renderiza a página HTML do formulário (rota pública, sem API key)"
      description: "Aberta pela webview no celular do cliente. O token assinado (HMAC) carrega a definição do form."
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "HTML do formulário" }
        "400": { description: "Token inválido" }

  /forms/{token}/submit:
    post:
      tags: [Interativas]
      summary: "Recebe o preenchimento do formulário (rota pública, sem API key)"
      description: >
        Enviado pela página do form (application/x-www-form-urlencoded). Injeta as
        respostas como mensagem recebida do cliente (Chatwoot + webhook `message`)
        e dispara o webhook `form_response`.
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: { type: string }
      responses:
        "200": { description: "Página de confirmação (HTML)" }
        "400": { description: "Token inválido" }
        "410": { description: "Sessão indisponível" }

  # ─────────────────────────────────────────────────────────────────
  # Agendamento (send_at)
  # ─────────────────────────────────────────────────────────────────
  /api/sessions/{sid}/schedule:
    post:
      tags: [Mensagens]
      summary: Agenda uma mensagem (texto ou imagem) para o futuro
      description: "Informe `text` OU uma imagem (`imageUrl`/`base64`, com `caption` opcional)."
      parameters:
        - { $ref: "#/components/parameters/Sid" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, sendAt]
              properties:
                to: { type: string, example: "5561999999999" }
                sendAt: { type: integer, format: int64, description: "epoch (ms ou s) no futuro" }
                text: { type: string }
                imageUrl: { type: string }
                base64: { type: string }
                caption: { type: string }
      responses:
        "200":
          description: Agendada
          content:
            application/json:
              schema: { type: object, properties: { id: { type: integer }, sendAt: { type: integer, description: "epoch ms" }, status: { type: string, example: pending } } }
        "400": { description: "to obrigatório / sendAt no passado / text ou imagem obrigatório" }
    get:
      tags: [Mensagens]
      summary: Lista as mensagens agendadas da sessão
      parameters:
        - { $ref: "#/components/parameters/Sid" }
      responses:
        "200":
          description: Lista de agendamentos
          content:
            application/json:
              schema:
                type: object
                properties:
                  scheduled: { type: array, items: { $ref: "#/components/schemas/ScheduledMessage" } }
  /api/sessions/{sid}/schedule/{id}:
    delete:
      tags: [Mensagens]
      summary: Cancela um agendamento pendente
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Cancelado
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string, example: canceled } } }
        "404": { description: Não encontrado ou já processado }

  # ─────────────────────────────────────────────────────────────────
  # Disparo em massa (blast)
  # ─────────────────────────────────────────────────────────────────
  /api/sessions/{sid}/blast:
    post:
      tags: [Disparo]
      summary: Dispara uma campanha (texto ou imagem) com pacing anti-ban
      description: "Informe `text` OU uma imagem (`imageUrl`/`base64`, com `caption` opcional)."
      parameters:
        - { $ref: "#/components/parameters/Sid" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { type: array, items: { type: string }, description: "Lista de destinatários" }
                text: { type: string }
                imageUrl: { type: string }
                base64: { type: string }
                caption: { type: string }
                delayMs: { type: integer, description: "Atraso base entre envios (padrão 3000)" }
                jitterMs: { type: integer, description: "Variação aleatória adicional" }
      responses:
        "200":
          description: Campanha iniciada
          content:
            application/json:
              schema: { type: object, properties: { jobId: { type: string }, status: { type: string, example: pending }, total: { type: integer } } }
        "400": { description: "to (lista) obrigatório / text ou imagem obrigatório" }
  /api/sessions/{sid}/blasts:
    get:
      tags: [Disparo]
      summary: Lista as campanhas da sessão
      parameters: [ { $ref: "#/components/parameters/Sid" } ]
      responses:
        "200":
          description: Lista de campanhas
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs: { type: array, items: { $ref: "#/components/schemas/BlastJob" } }
  /api/sessions/{sid}/blasts/{id}:
    get:
      tags: [Disparo]
      summary: Status de uma campanha (com resultados por destinatário)
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Status da campanha
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BlastJob"
                  - type: object
                    properties:
                      results:
                        type: array
                        items:
                          type: object
                          properties:
                            to: { type: string }
                            ok: { type: boolean }
                            msgId: { type: string }
                            error: { type: string }
        "404": { description: Não encontrada }
  /api/sessions/{sid}/blasts/{id}/cancel:
    post:
      tags: [Disparo]
      summary: Cancela uma campanha em andamento
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Cancelamento solicitado
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string, example: canceling } } }
        "404": { description: "job não encontrado" }

  # ─────────────────────────────────────────────────────────────────
  # Webhook — status/DLQ/replay/reenable
  # ─────────────────────────────────────────────────────────────────
  /api/sessions/{sid}/webhooks/status:
    get:
      tags: [Webhook]
      summary: Estado do circuito de entrega do webhook (circuit breaker + DLQ)
      parameters: [ { $ref: "#/components/parameters/Sid" } ]
      responses:
        "200":
          description: Estado do circuito
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { type: string, enum: [closed, open, disabled] }
                  consecutiveFailures: { type: integer }
                  dlqSize: { type: integer }
                  disabledReason: { type: string, description: "Só quando disabled" }
                  openUntil: { type: integer, format: int64, description: "epoch ms (só com o circuito aberto)" }
  /api/sessions/{sid}/webhooks/dlq:
    get:
      tags: [Webhook]
      summary: Lista os eventos na dead-letter queue (falharam a entrega)
      parameters: [ { $ref: "#/components/parameters/Sid" } ]
      responses:
        "200":
          description: Itens da DLQ
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        event: { type: string }
                        url: { type: string }
                        body: { type: object, description: "Payload original" }
                        lastError: { type: string }
                        attempts: { type: integer }
                        createdAt: { type: integer, format: int64, description: "epoch ms" }
  /api/sessions/{sid}/webhooks/dlq/{id}/replay:
    post:
      tags: [Webhook]
      summary: Reenvia um item da DLQ
      parameters:
        - { $ref: "#/components/parameters/Sid" }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Reenviado
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string, example: replayed } } }
        "404": { description: Item não encontrado }
        "409": { description: Falha no reenvio / circuito aberto/desabilitado }
  /api/sessions/{sid}/webhooks/reenable:
    post:
      tags: [Webhook]
      summary: Religa um webhook desabilitado/aberto (zera o circuito)
      parameters: [ { $ref: "#/components/parameters/Sid" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string, example: ok } } }

  # ─────────────────────────────────────────────────────────────────
  # Observabilidade (sem autenticação, fora de /api)
  # ─────────────────────────────────────────────────────────────────
  /livez:
    get:
      tags: [Observabilidade]
      summary: Liveness probe
      security: []
      responses: { "200": { description: ok } }
  /readyz:
    get:
      tags: [Observabilidade]
      summary: Readiness probe
      security: []
      responses: { "200": { description: ok } }
  /metrics:
    get:
      tags: [Observabilidade]
      summary: Métricas Prometheus (texto)
      security: []
      responses: { "200": { description: "wacalls_sessions / wacalls_webhook_dlq_total / wacalls_uptime_seconds" } }
