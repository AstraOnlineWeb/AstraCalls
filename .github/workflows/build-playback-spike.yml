name: Build WaCalls playback spike

on:
  workflow_dispatch:
  pull_request:
    branches:
      - fix/wacalls-recording-persistent-index
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image only
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: wacalls:playback-spike-20260705
